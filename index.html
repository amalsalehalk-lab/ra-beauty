<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RA Beauty — نظام الإدارة</title>
<meta name="theme-color" content="#4A1E42">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RA Beauty">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F1F3; --surface:#FFFFFF; --surface-2:#FBF7F9;
  --ink:#2B1A2A; --muted:#7A6873; --line:#E9DEE4;
  --plum:#6B2E5F; --plum-dark:#4A1E42; --plum-soft:#F2E6F0;
  --gold:#C79A4B; --gold-soft:#F7EFDF;
  --sage:#3F7A63; --sage-soft:#E4F0EA;
  --clay:#B4453C; --clay-soft:#FBE8E6;
  --r-lg:16px; --r-md:11px; --r-sm:8px;
  --shadow:0 1px 2px rgba(43,26,42,.05), 0 8px 24px -12px rgba(43,26,42,.18);
  --f-display:"Tajawal","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body);
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;margin:0;letter-spacing:-.2px}
a{color:var(--plum)}
.hidden{display:none !important}
::selection{background:var(--plum-soft)}
:focus-visible{outline:2px solid var(--plum);outline-offset:2px;border-radius:4px}

/* ============ LOGIN ============ */
#login{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}
.login-brand{
  background:linear-gradient(155deg,var(--plum-dark) 0%, var(--plum) 55%, #7C3A6C 100%);
  color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:44px 40px;position:relative;overflow:hidden;
}
.login-brand::after{
  content:"";position:absolute;inset:auto -120px -160px auto;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%, rgba(199,154,75,.35), transparent 62%);
}
.monogram{font-family:var(--f-display);line-height:1}
.monogram b{display:block;font-size:76px;font-weight:800;letter-spacing:2px}
.monogram em{display:block;font-style:normal;font-size:21px;font-weight:500;letter-spacing:.62em;
  color:var(--gold);margin-top:8px;padding-inline-start:4px}
.brand-rule{width:56px;height:2px;background:var(--gold);margin:18px 0}
.login-brand p{max-width:34ch;color:#EDDCE8;margin:0;font-weight:300}
.brand-foot{font-size:12.5px;color:#D9C3D4;position:relative;z-index:1}
.login-panel{display:flex;align-items:center;justify-content:center;padding:32px;background:var(--surface);padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.login-card{width:100%;max-width:340px}
.login-card h2{font-size:26px;margin-bottom:4px}
.login-card .sub{color:var(--muted);font-size:14px;margin:0 0 26px}
.err{background:var(--clay-soft);color:var(--clay);padding:9px 12px;border-radius:var(--r-sm);font-size:13.5px;margin-bottom:14px}

/* ============ FORM ATOMS ============ */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface);transition:border-color .15s, box-shadow .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--plum);box-shadow:0 0 0 3px var(--plum-soft)
}
.field textarea{resize:vertical;min-height:70px}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.btn{
  border:1px solid transparent;border-radius:var(--r-sm);padding:10px 16px;font-weight:600;font-size:14px;
  background:var(--plum);color:#fff;transition:filter .15s, background .15s;
}
.btn:hover{filter:brightness(1.1)}
.btn:active{filter:brightness(.95)}
.btn.block{width:100%;padding:12px}
.btn.ghost{background:transparent;color:var(--plum);border-color:var(--line)}
.btn.ghost:hover{background:var(--plum-soft)}
.btn.quiet{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.btn.quiet:hover{background:var(--plum-soft)}
.btn.danger{background:var(--clay)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:var(--r-sm)}
.btn.gold{background:var(--gold);color:#3A2A08}

/* ============ APP SHELL ============ */
#app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--surface);border-left:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.side .logo{font-family:var(--f-display);padding:0 8px 4px;line-height:1}
.side .logo b{display:block;font-size:32px;font-weight:800;letter-spacing:1.5px}
.side .logo em{display:block;font-style:normal;font-size:11.5px;font-weight:500;letter-spacing:.5em;
  color:var(--gold);margin-top:5px;padding-inline-start:2px}
.side .tag{font-size:11px;color:var(--muted);padding:0 8px 18px;letter-spacing:.14em;text-transform:uppercase}
.nav{border:0;background:transparent;text-align:right;padding:10px 12px;border-radius:var(--r-md);color:var(--ink);
  font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:10px;transition:background .14s}
.nav:hover{background:var(--surface-2)}
.nav.on{background:var(--plum);color:#fff}
.nav .ic{width:20px;text-align:center;font-size:15px;opacity:.9}
.nav .count{margin-inline-start:auto;background:var(--clay);color:#fff;font-size:11px;font-weight:700;
  padding:1px 7px;border-radius:20px;min-width:20px;text-align:center}
.nav.on .count{background:var(--gold);color:#3A2A08}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px}
.who{display:flex;align-items:center;gap:10px;padding:0 6px 10px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;font-family:var(--f-display);flex:none}
.who .nm{font-weight:600;font-size:13.5px;line-height:1.25}
.who .rl{font-size:11.5px;color:var(--muted)}
.syncbar{font-size:11px;color:var(--muted);padding:8px 8px 0;cursor:pointer;letter-spacing:.02em}

.main{padding:26px 30px 60px;max-width:1240px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head h1{font-size:27px;letter-spacing:-.4px}
.page-head .desc{color:var(--muted);font-size:13.5px;margin-top:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ============ CARDS / TABLES ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.card h3{font-size:16px;margin-bottom:2px}
.card .card-sub{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g-2-1{grid-template-columns:1.6fr 1fr}
.stat .lbl{font-size:12px;color:var(--muted);letter-spacing:.06em;font-weight:600}
.stat .val{font-family:var(--f-display);font-size:30px;line-height:1.15;margin-top:6px;letter-spacing:-1px}
.stat .val small{font-size:14px;color:var(--muted);font-family:var(--f-body);letter-spacing:0;margin-inline-start:4px}
.stat .note{font-size:12px;color:var(--muted);margin-top:4px}
.stat.accent{background:linear-gradient(150deg,var(--plum-dark),var(--plum));color:#fff;border-color:transparent}
.stat.accent .lbl,.stat.accent .note{color:#E7D3E3}
.stat.accent .val small{color:#E7D3E3}

table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:right;
  padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.num{font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;margin:0 -18px -18px;padding:0 18px 4px}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.plum{background:var(--plum-soft);color:var(--plum-dark)}
.chip.gold{background:var(--gold-soft);color:#8A6415}
.chip.sage{background:var(--sage-soft);color:var(--sage)}
.chip.clay{background:var(--clay-soft);color:var(--clay)}
.chip.grey{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-family:var(--f-display);font-size:17px;color:var(--ink);margin-bottom:4px}
.empty .btn{margin-top:14px}

/* ============ DAY RAIL (signature) ============ */
.rail{position:relative;padding-inline-start:6px}
.rail::before{content:"";position:absolute;top:6px;bottom:6px;right:74px;width:1px;background:var(--line)}
.slot{display:grid;grid-template-columns:74px 1fr;gap:0;margin-bottom:12px;position:relative}
.slot .t{font-family:var(--f-display);font-size:15px;padding-top:12px;color:var(--ink);position:relative}
.slot .t em{display:block;font-size:11px;color:var(--muted);font-style:normal;font-family:var(--f-body)}
.slot .t::after{content:"";position:absolute;top:19px;left:-5px;width:9px;height:9px;border-radius:50%;
  background:var(--surface);border:2px solid var(--plum)}
.slot.done .t::after{background:var(--sage);border-color:var(--sage)}
.slot.cancel .t::after{background:var(--line);border-color:var(--line)}
.appt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;
  margin-inline-start:20px;border-inline-start:4px solid var(--plum);transition:transform .12s, box-shadow .12s;cursor:pointer}
.appt:hover{transform:translateX(-3px);box-shadow:var(--shadow)}
.appt .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.appt .cn{font-weight:700;font-size:15px}
.appt .sv{color:var(--muted);font-size:13px;margin-top:3px}
.appt .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px;align-items:center}
.appt .price{margin-inline-start:auto;font-family:var(--f-display);font-size:16px;color:var(--ink)}
.slot.done .appt{background:var(--surface-2)}
.slot.cancel .appt{opacity:.55}

/* ============ CALENDAR ============ */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-size:11.5px;color:var(--muted);text-align:center;font-weight:700;padding-bottom:2px}
.cal .cell{min-height:82px;border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 7px;
  background:var(--surface);cursor:pointer;transition:border-color .12s, background .12s;overflow:hidden}
.cal .cell:hover{border-color:var(--plum);background:var(--plum-soft)}
.cal .cell.empty{border:0;background:transparent;cursor:default;min-height:0}
.cal .cell.today{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.cal .dnum{font-size:12.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.cal .cell.has .dnum{color:var(--ink)}
.cal .pill{display:block;font-size:10.5px;background:var(--surface-2);border-radius:4px;padding:2px 5px;
  margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .more{font-size:10.5px;color:var(--muted);margin-top:3px}
.cal .sum{font-size:10.5px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.month-card{cursor:pointer;transition:transform .12s, box-shadow .12s}
.month-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--plum)}
.month-card.off{opacity:.55}

.cal .occ{display:block;font-size:9.5px;font-weight:700;background:var(--gold-soft);color:#8A6415;
  border-radius:4px;padding:1px 5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .cell.occ-day{background:#FFFCF4}
.occ-strip{background:var(--gold-soft);border:1px solid #EBD9AE;color:#8A6415;border-radius:var(--r-md);
  padding:10px 14px;margin-bottom:14px;font-size:13.5px}
.occ-strip b{font-family:var(--f-display)}

/* ============ IMPORTANT DATES ============ */
.soon-card{background:var(--gold-soft);border:1px solid #EBD9AE;border-radius:var(--r-md);padding:12px 14px;cursor:pointer;transition:.12s}
.soon-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.soon-card .cnt{font-family:var(--f-display);font-weight:700;font-size:12px;color:#8A6415;letter-spacing:.02em}
.soon-card .nm{font-family:var(--f-display);font-size:16px;font-weight:700;margin-top:3px}
.soon-card .dt{font-size:12px;color:var(--muted);margin-top:2px}
.soon-card .nt{font-size:12px;color:#8A6415;margin-top:6px}
.card.dim{opacity:.66}
.occ-row{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.occ-row:last-child{border-bottom:0}
.occ-row:hover .b b{color:var(--plum)}
.occ-row.past{opacity:.5}
.occ-row .d{font-family:var(--f-display);font-weight:700;font-size:15px;min-width:26px;text-align:center;
  background:var(--surface-2);border-radius:6px;padding:2px 0;color:var(--plum-dark)}
.occ-row .b{font-size:13.5px;line-height:1.5}
.occ-row .b em{display:block;font-style:normal;font-size:11.5px;color:var(--muted)}
.occ-row .b em.nt{color:#8A6415}

/* ============ CLIENT PROFILE ============ */
.prof-head{display:flex;align-items:center;gap:14px;padding-bottom:16px;border-bottom:1px solid var(--line);
  margin-bottom:16px;flex-wrap:wrap}
.prof-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.prof-stats>div{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px}
.prof-stats .k{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:3px}
.prof-stats b{font-family:var(--f-display);font-size:19px;font-weight:700}
.prof-sec{margin-bottom:18px}
.prof-sec h4{font-size:14px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line);color:var(--plum)}
.cl-link{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--plum);
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:right}
.cl-link:hover{color:var(--gold)}
@media (max-width:900px){ .prof-stats{grid-template-columns:repeat(2,1fr)} }

/* ============ TASK BOARD ============ */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.tcol{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px}
.thead{font-family:var(--f-display);font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;
  padding:0 4px 10px;color:var(--ink)}
.thead .cnt{margin-inline-start:auto;background:var(--surface);border:1px solid var(--line);color:var(--muted);
  font-size:11.5px;padding:1px 8px;border-radius:20px;font-family:var(--f-body)}
.task{background:var(--surface);border:1px solid var(--line);border-inline-start:3px solid var(--plum);
  border-radius:var(--r-md);padding:11px 12px;margin-bottom:9px;cursor:pointer;transition:transform .12s, box-shadow .12s}
.task:hover{transform:translateX(-2px);box-shadow:var(--shadow)}
.task.late{border-inline-start-color:var(--clay)}
.task.ok{border-inline-start-color:var(--sage);opacity:.72}
.task.ok .ttl{text-decoration:line-through;color:var(--muted)}
.ttop{display:flex;align-items:flex-start;gap:9px}
.tick{width:19px;height:19px;flex:none;margin-top:2px;border:2px solid var(--line);border-radius:6px;
  background:var(--surface);padding:0;transition:.12s}
.tick:hover{border-color:var(--sage)}
.tick.on{background:var(--sage);border-color:var(--sage);position:relative}
.tick.on::after{content:"✓";position:absolute;inset:0;color:#fff;font-size:12px;line-height:15px;text-align:center}
.ttl{font-size:14px;font-weight:600;line-height:1.45}
.tnote{font-size:12.5px;color:var(--muted);margin:6px 0 0 28px;padding-inline-start:28px}
.tmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;padding-inline-start:28px}
.tempty{text-align:center;color:var(--muted);font-size:13px;padding:18px 8px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick input,.quick select{padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.quick #tqTitle{flex:1;min-width:200px}
.quick input:focus,.quick select:focus{outline:none;border-color:var(--plum);box-shadow:0 0 0 3px var(--plum-soft)}

/* ============ CONSUMPTION SHEET ============ */
.cons-cat{font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--plum);
  margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.cons-cat:first-child{margin-top:0}
.cons-row{display:flex;align-items:center;gap:12px;padding:7px 2px;border-bottom:1px dashed var(--line)}
.cons-row .nm{font-size:14px}
.cons-row .nm em{display:block;font-style:normal;font-size:11.5px;color:var(--muted)}
.cons-q{width:78px;margin-inline-start:auto;padding:7px 9px;border:1px solid var(--line);
  border-radius:var(--r-sm);text-align:center;font-variant-numeric:tabular-nums}
.cons-q:focus{outline:none;border-color:var(--plum);box-shadow:0 0 0 3px var(--plum-soft)}

/* ============ ALERTS ============ */
.alert-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.alert-row:last-child{border-bottom:0}
.alert-row .qty{margin-inline-start:auto;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:5px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--sage);border-radius:4px}
.bar i.low{background:var(--gold)}
.bar i.out{background:var(--clay)}

/* ============ MODAL ============ */
.overlay{position:fixed;inset:0;background:rgba(43,26,42,.42);backdrop-filter:blur(3px);z-index:60;
  display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:620px;box-shadow:0 24px 60px -20px rgba(43,26,42,.5);
  animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-head h3{font-size:18px}
.modal-head .x{background:none;border:0;font-size:22px;color:var(--muted);line-height:1;padding:0 4px}
.modal-body{padding:20px 22px}
.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-start;flex-wrap:wrap}
.modal-foot .spacer{margin-inline-start:auto}

/* service picker lines */
.line-list{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;margin-bottom:10px}
.line{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
.line:last-child{border-bottom:0}
.line .nm{font-weight:600}
.line .pr{margin-inline-start:auto;font-variant-numeric:tabular-nums;font-weight:600}
.line .rm{background:none;border:0;color:var(--clay);font-size:17px;line-height:1;padding:0 2px}
.line-empty{padding:14px;text-align:center;color:var(--muted);font-size:13px}
.totals{background:var(--surface-2);border-radius:var(--r-sm);padding:12px 14px;font-size:14px}
.totals div{display:flex;justify-content:space-between;padding:3px 0}
.totals .grand{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-family:var(--f-display);font-size:18px}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{background:none;border:0;padding:9px 14px;font-weight:600;font-size:14px;color:var(--muted);
  border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--plum);border-bottom-color:var(--plum)}

/* filter bar */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters input,.filters select{padding:8px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);font-size:13.5px}
.filters input:focus,.filters select:focus{outline:none;border-color:var(--plum)}

/* invoice */
.inv-paper{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:26px}
.inv-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--plum);padding-bottom:14px;margin-bottom:16px;gap:16px}
.inv-head .mono{font-family:var(--f-display);line-height:1}
.inv-head .mono b{display:block;font-size:34px;font-weight:800;letter-spacing:1.5px}
.inv-head .mono em{display:block;font-style:normal;font-size:12px;font-weight:500;letter-spacing:.5em;color:var(--gold);margin-top:4px}
.inv-no{text-align:left;font-size:13px;color:var(--muted)}
.inv-no b{display:block;font-family:var(--f-display);font-size:19px;color:var(--ink);letter-spacing:0}
.inv-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;font-size:13.5px;margin-bottom:18px}
.inv-meta .k{color:var(--muted);font-size:12px}
.pay-log{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);margin-top:12px;padding-top:10px}
.stamp{display:inline-block;border:2px solid var(--sage);color:var(--sage);font-family:var(--f-display);
  padding:4px 14px;border-radius:6px;transform:rotate(-4deg);font-size:15px}
.stamp.due{border-color:var(--clay);color:var(--clay)}

/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:11px 20px;border-radius:30px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:all .25s;z-index:90}
#toast.show{opacity:1;transform:translateX(-50%)}

/* mobile */
@media (max-width:900px){
  #login{grid-template-columns:1fr}
  .login-brand{padding:30px 26px}
  .monogram{font-size:52px}
  #app{grid-template-columns:1fr}
  .side{position:fixed;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;overflow-x:auto;
    border-left:0;border-top:1px solid var(--line);gap:2px;z-index:50;
    padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
  .side .logo,.side .tag,.side-foot .who,.syncbar{display:none}
  .side-foot{margin:0;border:0;padding:0;display:flex}
  .nav{flex-direction:column;gap:3px;font-size:10.5px;padding:6px 9px;min-width:60px;justify-content:center;text-align:center}
  .nav .ic{font-size:17px}
  .nav .count{position:absolute;top:2px;left:6px;margin:0}
  .nav{position:relative}
  .main{padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(110px + env(safe-area-inset-bottom,0px))}
  .g4,.g3,.g2,.g-2-1,.row-2,.row-3{grid-template-columns:1fr}
  .page-head h1{font-size:22px}
  .rail::before{right:58px}
  .board{grid-template-columns:1fr}
  .quick{flex-direction:column}
  .quick #tqTitle{min-width:0}
  .cal{gap:3px}
  .cal .cell{min-height:56px;padding:4px}
  .cal .pill,.cal .more{display:none}
  .cal .dow{font-size:10px}
  .cal .sum{font-size:9.5px;margin-top:2px}
  .slot{grid-template-columns:58px 1fr}
  .appt{margin-inline-start:12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* print */
@media print{
  body{background:#fff}
  .side,.page-head .tools,.tabs,.filters,.no-print,#toast{display:none !important}
  #app{grid-template-columns:1fr}
  .main{padding:0}
  .overlay{position:static;background:none;padding:0;backdrop-filter:none}
  body:has(.overlay) #app{display:none}
  .modal{box-shadow:none;max-width:100%}
  .modal-head,.modal-foot{display:none}
  .inv-paper{border:0;padding:0}
}
</style>

<body>
<div id="root"></div>
<div id="modal-host"></div>
<div id="toast"></div>
<script>
(function(){
"use strict";
/* ========== 1. CONFIG, STATE, CLOUD ========== */
const CFGK='ra_cfg_v1', SESK='ra_ses_v1', CACHE='ra_cache_v1';
let S=null, ME=null, VIEW='home', TAB={acc:'invoices',bk:'day'}, D={}, CFG=null, SES=null, POLL=null;
let SYNC={at:null,err:null};
const LS={ get(k){ try{ return JSON.parse(localStorage.getItem(k)||'null') }catch(e){ return null } },
           set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)) }catch(e){} },
           del(k){ try{ localStorage.removeItem(k) }catch(e){} } };

const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('sv-SE');
const monthOf=d=>(d||today()).slice(0,7);
const money=n=>(Math.round((+n||0)*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fdate=d=>{ if(!d) return '—'; try{ return new Date(d+'T00:00').toLocaleDateString('ar-u-nu-latn',{weekday:'long',day:'numeric',month:'long'}) }catch(e){ return d } };
const fdateShort=d=>{ if(!d) return '—'; const p=String(d).split('-'); return p[2]+'/'+p[1]+'/'+p[0] };
const ftime=t=>{ if(!t) return ''; let[h,m]=t.split(':').map(Number); const s=h<12?'ص':'م'; h=h%12||12; return h+':'+String(m).padStart(2,'0')+' '+s };
const byId=(arr,id)=>(arr||[]).find(x=>x.id===id)||null;
const sum=(arr,f)=>(arr||[]).reduce((a,b)=>a+(+f(b)||0),0);
const isOwner=()=>!!ME&&ME.role==='owner';

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }

/* ---------- cloud API (Supabase REST — no libraries) ---------- */
const mailOf=u=>String(u).toLowerCase().trim().replace(/[^a-z0-9._-]/g,'')+'@ra-beauty.app';
const nameOfMail=e=>String(e||'').split('@')[0];

async function api(path,opts={}){
  const o=Object.assign({},opts); const retry=o._retry; delete o._retry;
  const r=await fetch(CFG.url+path,Object.assign({},o,{headers:Object.assign({
    'apikey':CFG.key,
    'Authorization':'Bearer '+((SES&&SES.access_token)||CFG.key),
    'Content-Type':'application/json'},o.headers||{})}));
  if(r.status===401&&SES&&SES.refresh_token&&!retry){
    if(await refreshSession()) return api(path,Object.assign({},opts,{_retry:true}));
  }
  const txt=await r.text();
  let j=null; try{ j=txt?JSON.parse(txt):null }catch(e){}
  if(!r.ok) throw new Error((j&&(j.error_description||j.msg||j.message||j.hint))||('خطأ اتصال '+r.status));
  return j;
}
async function signIn(username,password){
  const r=await fetch(CFG.url+'/auth/v1/token?grant_type=password',{method:'POST',
    headers:{'apikey':CFG.key,'Content-Type':'application/json'},
    body:JSON.stringify({email:mailOf(username),password})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description||j.msg||j.message||'تعذّر تسجيل الدخول');
  SES=j; LS.set(SESK,j); return j;
}
async function refreshSession(){
  try{
    const r=await fetch(CFG.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',
      headers:{'apikey':CFG.key,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:SES.refresh_token})});
    if(!r.ok) return false;
    SES=await r.json(); LS.set(SESK,SES); return true;
  }catch(e){ return false }
}
async function signUpUser(username,password,meta){
  const r=await fetch(CFG.url+'/auth/v1/signup',{method:'POST',
    headers:{'apikey':CFG.key,'Content-Type':'application/json'},
    body:JSON.stringify({email:mailOf(username),password,data:meta||{}})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description||j.msg||j.message||'تعذّر إنشاء الحساب');
  return j.user||j;
}
function signOutLocal(){ SES=null; ME=null; LS.del(SESK); if(POLL) clearInterval(POLL); POLL=null; }

/* ---------- data: everything lives in one `records` table ---------- */
const KINDS={service:'services',item:'items',booking:'bookings',invoice:'invoices',movement:'movements',expense:'expenses',client:'clients',package:'packages',sub:'subs',task:'tasks',occasion:'occasions',settle:'settles'};
const KIND_OF={services:'service',items:'item',bookings:'booking',invoices:'invoice',movements:'movement',expenses:'expense',clients:'client',packages:'package',subs:'sub',tasks:'task',occasions:'occasion',settles:'settle'};
const DEFAULT_SETTINGS={biz:'RA Beauty',tagline:'خدمات التجميل المنزلية',phone:'',transport:30};

function blank(){ const o={settings:Object.assign({},DEFAULT_SETTINGS),users:[]};
  Object.values(KINDS).forEach(k=>o[k]=[]); return o }

async function pull(){
  const [rows,profs]=await Promise.all([
    api('/rest/v1/records?select=id,kind,data'),
    api('/rest/v1/profiles?select=id,name,username,title,role,color')
  ]);
  const st=blank();
  st.users=(profs||[]).map(p=>({id:p.id,name:p.name||p.username,username:p.username,title:p.title||'',
                                role:p.role||'staff',color:p.color||'#6B2E5F'}));
  (rows||[]).forEach(r=>{
    if(r.kind==='setting'){ st.settings=Object.assign(st.settings,r.data||{}) }
    else if(KINDS[r.kind]) st[KINDS[r.kind]].push(r.data);
  });
  S=st; LS.set(CACHE,S); SYNC={at:new Date(),err:null}; paintSync();
  return S;
}
async function put(bucket,obj){
  const kind=KIND_OF[bucket]; if(!kind) return;
  try{
    await api('/rest/v1/records',{method:'POST',
      headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify({id:obj.id,kind:kind,data:obj,updated_at:new Date().toISOString()})});
    SYNC={at:new Date(),err:null};
  }catch(e){ SYNC.err=e.message; toast('تعذّر الحفظ في السحابة: '+e.message) }
  LS.set(CACHE,S); paintSync();
}
async function rm(id){
  try{ await api('/rest/v1/records?id=eq.'+encodeURIComponent(id),{method:'DELETE'}); SYNC={at:new Date(),err:null} }
  catch(e){ SYNC.err=e.message; toast('تعذّر الحذف من السحابة: '+e.message) }
  LS.set(CACHE,S); paintSync();
}
async function putSettings(){
  try{ await api('/rest/v1/records',{method:'POST',
    headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
    body:JSON.stringify({id:'settings',kind:'setting',data:S.settings,updated_at:new Date().toISOString()})});
    SYNC={at:new Date(),err:null};
  }catch(e){ SYNC.err=e.message; toast('تعذّر حفظ الإعدادات: '+e.message) }
  paintSync();
}
async function putProfile(p){
  try{ await api('/rest/v1/profiles',{method:'POST',
    headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(p)}); SYNC={at:new Date(),err:null} }
  catch(e){ SYNC.err=e.message; toast('تعذّر حفظ بيانات العضوة: '+e.message) }
  paintSync();
}
function syncText(){
  if(SYNC.err) return '⚠︎ آخر مزامنة فشلت';
  if(!SYNC.at) return 'جارٍ المزامنة…';
  return '✓ متزامن ' + SYNC.at.toLocaleTimeString('ar-u-nu-latn',{hour:'2-digit',minute:'2-digit'});
}
function paintSync(){ const el=document.getElementById('syncBar'); if(el){ el.textContent=syncText(); el.style.color=SYNC.err?'var(--clay)':'var(--muted)' } }
function startPoll(){
  if(POLL) clearInterval(POLL);
  POLL=setInterval(async()=>{
    if(!ME||document.getElementById('modal-host').innerHTML) return;
    try{ await pull(); render() }catch(e){ SYNC.err=e.message; paintSync() }
  },20000);
}

/* ---------- first-run catalog (only if the database is empty) ---------- */
function seedCatalog(){
  return {
    services:[
      {id:'s1',name:'مانيكير',cat:'أظافر',price:60,dur:45},
      {id:'s2',name:'بديكير',cat:'أظافر',price:70,dur:50},
      {id:'s3',name:'تركيب أظافر جل',cat:'أظافر',price:180,dur:90},
      {id:'s4',name:'تعبئة أظافر',cat:'أظافر',price:120,dur:60},
      {id:'s5',name:'رفع أظافر',cat:'أظافر',price:50,dur:30},
      {id:'s6',name:'تنظيف بشرة',cat:'بشرة',price:250,dur:60},
      {id:'s7',name:'مكياج سهرة',cat:'مكياج',price:400,dur:75},
      {id:'s8',name:'سيشوار',cat:'شعر',price:120,dur:45},
      {id:'s9',name:'حمام مغربي',cat:'جسم',price:200,dur:60},
      {id:'s10',name:'حناء يد',cat:'حناء',price:80,dur:30}
    ],
    items:[
      {id:'i1',name:'جل أظافر شفاف',cat:'أظافر',unit:'عبوة',qty:6,min:3,cost:45,cost0:45,supplier:''},
      {id:'i2',name:'مزيل أظافر (أسيتون)',cat:'أظافر',unit:'لتر',qty:3,min:3,cost:25,cost0:25,supplier:''},
      {id:'i3',name:'مبرد أظافر',cat:'أظافر',unit:'حبة',qty:24,min:10,cost:3,cost0:3,supplier:''},
      {id:'i4',name:'قفازات لاتكس',cat:'مستهلكات',unit:'علبة',qty:4,min:2,cost:20,cost0:20,supplier:''},
      {id:'i5',name:'مناشف استخدام مرة',cat:'مستهلكات',unit:'رزمة',qty:3,min:2,cost:35,cost0:35,supplier:''},
      {id:'i6',name:'ماسك تنظيف بشرة',cat:'بشرة',unit:'عبوة',qty:5,min:2,cost:60,cost0:60,supplier:''}
    ]
  };
}
async function seedIfEmpty(){
  if(!isOwner()||S.services.length||S.items.length) return;
  const c=seedCatalog();
  S.services=c.services; S.items=c.items;
  for(const s of c.services) await put('services',s);
  for(const i of c.items) await put('items',i);
  const occ=seedOccasions(); S.occasions=occ;
  for(const x of occ) await put('occasions',x);
  await api('/rest/v1/records',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
    body:JSON.stringify({id:'settings',kind:'setting',data:S.settings,updated_at:new Date().toISOString()})}).catch(()=>{});
}

/* ========== 2. DERIVED ========== */
const lowStock=()=>S.items.filter(i=>i.qty<=i.min);
const bookingTotal=b=>Math.max(0, sum(b.lines,l=>l.price*(l.qty||1)) + (+b.transport||0) - (+b.discount||0));
const visibleBookings=()=>isOwner()?S.bookings:S.bookings.filter(b=>b.staffId===ME.id);
const visibleInvoices=()=>{ if(isOwner()) return S.invoices; const ids=new Set(visibleBookings().map(b=>b.id)); return S.invoices.filter(v=>ids.has(v.bookingId)); };
const invPaid=v=>sum(v.payments||[],p=>p.amount);
const invStatus=v=>{ const p=invPaid(v); if(p<=0) return 'due'; if(p+0.009<v.total) return 'partial'; return 'paid'; };
const staffName=id=>{ const u=byId(S.users,id); return u?u.name:'—' };
const staffColor=id=>{ const u=byId(S.users,id); return u?u.color:'#7A6873' };

const ST={
  confirmed:{ar:'مؤكد',c:'plum'}, active:{ar:'جاري التنفيذ',c:'gold'},
  done:{ar:'تم',c:'sage'}, cancelled:{ar:'ملغي',c:'grey'}
};
const PAYST={paid:{ar:'مدفوعة',c:'sage'},partial:{ar:'مدفوعة جزئياً',c:'gold'},due:{ar:'غير مدفوعة',c:'clay'}};

function nextInvNo(){
  let max=1000;
  S.invoices.forEach(v=>{ const n=parseInt(String(v.no).replace(/\D/g,''),10)||0; if(n>max) max=n });
  return 'INV-'+(max+1);
}
function syncInvoice(b){
  if(b.status!=='done') return null;
  let v=S.invoices.find(x=>x.bookingId===b.id);
  const lines=b.lines.map(l=>({name:l.name,price:l.price,qty:l.qty||1}));
  if(!v){
    v={id:uid('v'),no:nextInvNo(),bookingId:b.id,client:b.client,phone:b.phone,date:b.date,staffId:b.staffId,
       lines:lines,transport:+b.transport||0,discount:+b.discount||0,total:bookingTotal(b),payments:[],
       createdAt:new Date().toISOString()};
    S.invoices.push(v);
  }else{
    v.lines=lines; v.transport=+b.transport||0; v.discount=+b.discount||0;
    v.total=bookingTotal(b); v.client=b.client; v.phone=b.phone; v.date=b.date; v.staffId=b.staffId;
  }
  return v;
}
function upsertClient(b){
  let c=S.clients.find(x=>x.phone&&b.phone&&x.phone===b.phone)||S.clients.find(x=>x.name===b.client);
  if(!c){ c={id:uid('c'),name:b.client,phone:b.phone||'',area:b.area||'',notes:''}; S.clients.push(c) }
  else { c.name=b.client; if(b.phone) c.phone=b.phone; if(b.area) c.area=b.area }
  return c;
}

/* ========== 3. BOOT ========== */
async function boot(){
  CFG=LS.get(CFGK);
  if(!CFG||!CFG.url||!CFG.key){ S=blank(); render(); return }
  SES=LS.get(SESK);
  S=LS.get(CACHE)||blank();
  if(SES&&SES.access_token){
    try{
      const me=await api('/auth/v1/user');
      await afterAuth(me.id);
      return;
    }catch(e){ signOutLocal(); }
  }
  render();
}
async function afterAuth(userId){
  await pull();
  ME=S.users.find(u=>u.id===userId)||null;
  if(!ME){ signOutLocal(); render(); toast('الحساب غير مفعّل — يُرجى مراجعة إدارة الحساب'); return }
  await seedIfEmpty();
  VIEW='home'; D={}; render(); startPoll();
}
document.addEventListener('DOMContentLoaded',boot);

/* ========== 4. SHELL ========== */
const root=()=>document.getElementById('root');
function render(){
  root().innerHTML = !CFG ? setupView() : (ME ? shell() : loginView());
  paintSync();
  try{ window.scrollTo({top:0}) }catch(e){}
}
function setupView(err){
  return `<div id="login">
    <div class="login-brand">
      <div><div class="monogram"><b>RA</b><em>BEAUTY</em></div><div class="brand-rule"></div>
        <p>ربط النظام بقاعدة بياناتك السحابية — مرة واحدة على كل جهاز.</p></div>
      <div class="brand-foot">بعد الربط يعمل الفريق على البيانات نفسها لحظياً</div>
    </div>
    <div class="login-panel"><div class="login-card">
      <h2>إعداد الاتصال</h2>
      <p class="sub">انسخي القيمتين من لوحة Supabase ← Project Settings ← API</p>
      ${err?`<div class="err">${esc(err)}</div>`:''}
      <div class="field"><label>Project URL</label><input id="cfgUrl" dir="ltr" placeholder="https://xxxx.supabase.co"></div>
      <div class="field"><label>anon public key</label><input id="cfgKey" dir="ltr" placeholder="eyJhbGciOi..."></div>
      <button class="btn block" data-act="cfg-save">حفظ ومتابعة</button>
      <p style="font-size:12.5px;color:var(--muted);margin-top:14px">
        هذه المفاتيح عامة ومخصّصة للاستخدام في المتصفح؛ الحماية تعتمد على قواعد الوصول في قاعدة البيانات لا على إخفاء المفتاح.</p>
    </div></div>
  </div>`;
}
function loginView(err){
  return `<div id="login">
    <div class="login-brand">
      <div>
        <div class="monogram"><b>RA</b><em>BEAUTY</em></div>
        <div class="brand-rule"></div>
        <p>نظام إدارة الحجوزات والمخزون والفواتير — خدمات التجميل المنزلية.</p>
      </div>
      <div class="brand-foot">دخول خاص بفريق العمل · لكل عضوة في الفريق صلاحيات محدّدة</div>
    </div>
    <div class="login-panel"><div class="login-card">
      <h2>تسجيل الدخول</h2>
      <p class="sub">أدخلي اسم المستخدم وكلمة المرور</p>
      <div id="loginErr">${err?`<div class="err">${esc(err)}</div>`:''}</div>
      <div class="field"><label>اسم المستخدم</label><input id="lu" dir="ltr" autocomplete="username" placeholder="amal"></div>
      <div class="field"><label>كلمة المرور</label><input id="lp" type="password" autocomplete="current-password" placeholder="••••••"></div>
      <button class="btn block" data-act="login" id="loginBtn">دخول</button>

    </div></div>
  </div>`;
}

    {v:'home',ic:'◈',t:'الرئيسية'},
    {v:'bookings',ic:'✦',t:'الحجوزات'},

}
function shell(){

        </div>
        <button class="nav" data-act="pwd"><span class="ic">✎</span><span>كلمة المرور</span></button>

function head(title,desc,tools){
  return `<div class="page-head"><div><h1>${title}</h1><div class="desc">${desc||''}</div></div><div class="tools">${tools||''}</div></div>`;
}

/* ========== 5. HOME ========== */
function vHome(){
  const t=today(), m=monthOf(t);
  const mine=visibleBookings();
  const dayList=mine.filter(b=>b.date===t).sort((a,b)=>a.time.localeCompare(b.time));
  const monthInv=visibleInvoices().filter(v=>monthOf(v.date)===m);
  const collected=sum(monthInv,v=>invPaid(v));
  const billed=sum(monthInv,v=>v.total);
  const due=billed-collected;
  const low=lowStock();
  const upcoming=mine.filter(b=>b.date>t&&b.status!=='cancelled').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,5);

  const stats=`<div class="grid g4" style="margin-bottom:16px">
    <div class="card stat accent"><div class="lbl">حجوزات اليوم</div><div class="val">${dayList.filter(b=>b.status!=='cancelled').length}</div>
      <div class="note">${fdate(t)}</div></div>
    <div class="card stat"><div class="lbl">محصّل هذا الشهر</div><div class="val">${money(collected)}<small>ر.ق</small></div>
      <div class="note">من إجمالي ${money(billed)} ر.ق</div></div>
    <div class="card stat"><div class="lbl">مبالغ متبقٍّة</div><div class="val" style="color:${due>0?'var(--clay)':'inherit'}">${money(due)}<small>ر.ق</small></div>
      <div class="note">${monthInv.filter(v=>invStatus(v)!=='paid').length} فاتورة غير مسددة</div></div>
    <div class="card stat"><div class="lbl">أصناف تحت الحد</div><div class="val" style="color:${low.length?'var(--clay)':'inherit'}">${low.length}</div>
      <div class="note">${low.length?'بحاجة إلى تعبئة':'المخزون في وضع جيد'}</div></div>
  </div>`;

  return head(`أهلاً  ${esc(ME.name)}`,'ملخّص اليوم وأبرز ما يستدعي المتابعة',
      `<button class="btn" data-act="bk-new">+ حجز جديد</button>`)
    + stats
    + `<div class="grid g-2-1">
        <div class="card"><h3>يوم اليوم</h3><div class="card-sub">${fdate(t)}</div>${rail(dayList)}</div>
        <div>
          <div class="card" style="margin-bottom:16px"><h3>تنبيه المخزون</h3><div class="card-sub">أصناف وصلت إلى الحد الأدنى</div>
            ${low.length?low.map(i=>`<div class="alert-row"><span class="dot" style="background:${i.qty<=0?'var(--clay)':'var(--gold)'}"></span>
               <span>${esc(i.name)}</span><span class="qty num" style="color:${i.qty<=0?'var(--clay)':'var(--gold)'}">${i.qty} ${esc(i.unit)}</span></div>`).join('')
              :'<div class="empty" style="padding:18px">جميع الأصناف أعلى من الحد الأدنى</div>'}
            <button class="btn ghost sm" style="margin-top:12px;width:100%" data-act="nav" data-v="inventory">فتح المخزون</button>
          </div>
          ${(function(){const mt=myTasks().sort(taskSort).slice(0,4);
            return `<div class="card" style="margin-bottom:16px"><h3>مهامي</h3>
              <div class="card-sub">${myTasks().length} مهمة مفتوحة باسمك</div>
              ${mt.length?mt.map(t=>{const late=t.due&&t.due<today();
                return `<div class="alert-row" data-act="task-open" data-id="${t.id}" style="cursor:pointer">
                  <button class="tick" data-act="task-toggle" data-id="${t.id}"></button>
                  <span>${esc(t.title)}${t.due?`<br><span style="font-size:12px;color:${late?'var(--clay)':'var(--muted)'}">${late?'متأخرة · ':''}${fdateShort(t.due)}</span>`:''}</span>
                </div>`}).join(''):'<div class="empty" style="padding:18px">لا توجد مهام مفتوحة</div>'}
              <button class="btn ghost sm" style="margin-top:12px;width:100%" data-act="nav" data-v="tasks">فتح المهام</button>
            </div>`})()}
          <div class="card"><h3>حجوزات جاية</h3><div class="card-sub">أقرب ${upcoming.length} مواعيد</div>
            ${upcoming.length?upcoming.map(b=>`<div class="alert-row" data-act="bk-open" data-id="${b.id}" style="cursor:pointer">
                <span class="dot" style="background:${staffColor(b.staffId)}"></span>
                <span><b>${esc(b.client)}</b><br><span style="font-size:12px;color:var(--muted)">${fdateShort(b.date)} · ${ftime(b.time)}</span></span>
                <span class="qty num">${money(bookingTotal(b))}</span></div>`).join('')
              :'<div class="empty" style="padding:18px">لا توجد حجوزات قادمة</div>'}
          </div>
        </div>
      </div>`;
}
function rail(list){
  if(!list.length) return `<div class="empty"><div class="big">لا مواعيد اليوم</div>لا توجد حجوزات مسجّلة في هذا اليوم<br>
     <button class="btn" data-act="bk-new">+ أضيفي حجزاً</button></div>`;
  return `<div class="rail">`+list.map(b=>{
    const st=ST[b.status]||ST.confirmed;
    const dur=b.lines.reduce((a,l)=>{const s=byId(S.services,l.sid); return a+((s?s.dur:30)*(l.qty||1))},0);
    return `<div class="slot ${b.status==='done'?'done':''} ${b.status==='cancelled'?'cancel':''}">
      <div class="t">${ftime(b.time)}<em>${dur} د</em></div>
      <div class="appt" style="border-inline-start-color:${staffColor(b.staffId)}" data-act="bk-open" data-id="${b.id}">
        <div class="top"><span class="cn">${esc(b.client)}</span><span class="chip ${st.c}">${st.ar}</span></div>
        <div class="sv">${b.lines.map(l=>esc(l.name)+(l.qty>1?' ×'+l.qty:'')).join(' · ')||'بدون خدمات'}</div>
        <div class="meta">
          <span>◷ ${esc(b.area||'—')}</span>
          <span><span class="dot" style="background:${staffColor(b.staffId)}"></span> ${esc(staffName(b.staffId))}</span>
          ${b.phone?`<span>☎ ${esc(b.phone)}</span>`:''}
          <span class="price num">${money(bookingTotal(b))} ر.ق</span>
        </div>
      </div></div>`;
  }).join('')+`</div>`;
}

/* ========== 6. BOOKINGS ========== */
function vBookings(){
  const nowY=String(new Date().getFullYear());
  const f=D.bf=Object.assign({date:today(),month:monthOf(today()),year:nowY,status:'',staff:'',q:''},D.bf||{});
  const all=visibleBookings();
  const list=all.slice().sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  const staffOpts=S.users.map(u=>`<option value="${u.id}" ${f.staff===u.id?'selected':''}>${esc(u.name)}</option>`).join('');
  const tabs=`<div class="tabs">
    <button class="tab ${TAB.bk==='day'?'on':''}" data-act="tab" data-k="bk" data-v="day">اليوم</button>
    <button class="tab ${TAB.bk==='month'?'on':''}" data-act="tab" data-k="bk" data-v="month">الشهر</button>
    <button class="tab ${TAB.bk==='year'?'on':''}" data-act="tab" data-k="bk" data-v="year">السنة</button>
    <button class="tab ${TAB.bk==='dates'?'on':''}" data-act="tab" data-k="bk" data-v="dates">التواريخ المهمة</button>
    <button class="tab ${TAB.bk==='list'?'on':''}" data-act="tab" data-k="bk" data-v="list">كل الحجوزات (${list.length})</button>
  </div>`;
  const headline=head('الحجوزات','تسجيل المواعيد وتعديل الخدمات وإغلاق الموعد بعد إتمامه',
    `<button class="btn quiet" data-act="occ-manage">المناسبات</button>
     <button class="btn" data-act="bk-new">+ حجز جديد</button>`)+tabs;

  if(TAB.bk==='dates') return head('التواريخ المهمة','مناسبات السنة كاملة لتخطيط العروض والباقات والجدول',
      `<button class="btn" data-act="bk-new">+ حجز جديد</button>`)+tabs+datesTab(f);

  /* ---------- month calendar ---------- */
  if(TAB.bk==='month'){
    const m=f.month||monthOf(today());
    const Y=+m.slice(0,4), M=+m.slice(5,7);
    const daysIn=new Date(Y,M,0).getDate(), startDow=new Date(Y,M-1,1).getDay();
    const inMonth=all.filter(b=>monthOf(b.date)===m);
    const live=inMonth.filter(b=>b.status!=='cancelled');
    const dow=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
    const OM=occMap(Y);
    let cells='';
    for(let i=0;i<startDow;i++) cells+=`<div class="cell empty"></div>`;
    for(let d=1;d<=daysIn;d++){
      const ds=`${Y}-${String(M).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const day=live.filter(b=>b.date===ds).sort((a,b)=>a.time.localeCompare(b.time));
      const tot=sum(day,bookingTotal);
      cells+=`<div class="cell ${day.length?'has':''} ${ds===today()?'today':''} ${(OM[ds]||[]).length?'occ-day':''}" data-act="open-day" data-d="${ds}">
        <div class="dnum">${d}</div>
        ${(OM[ds]||[]).map(oc=>`<span class="occ" title="${esc(oc.note||'')}">${esc(oc.name)}</span>`).join('')}
        ${day.slice(0,2).map(b=>`<span class="pill" style="border-inline-start:3px solid ${staffColor(b.staffId)}">${ftime(b.time)} ${esc(b.client)}</span>`).join('')}
        ${day.length>2?`<div class="more">+${day.length-2} غيرها</div>`:''}
        ${day.length?`<div class="sum"><b>${day.length}</b> موعد · ${money(tot)}</div>`:''}
      </div>`;
    }
    return headline+`
      <div class="filters">
        <button class="btn quiet sm" data-act="bf-mshift" data-s="-1">‹ الشهر السابق</button>
        <input type="month" value="${m}" data-act="bf" data-k="month">
        <button class="btn quiet sm" data-act="bf-mshift" data-s="1">الشهر التالي ›</button>
      </div>
      <div class="grid g3" style="margin-bottom:16px">
        <div class="card stat"><div class="lbl">مواعيد الشهر</div><div class="val">${live.length}</div>
          <div class="note">${inMonth.length-live.length} ملغي</div></div>
        <div class="card stat"><div class="lbl">منجزة</div><div class="val" style="color:var(--sage)">${inMonth.filter(b=>b.status==='done').length}</div></div>
        <div class="card stat accent"><div class="lbl">إجمالي الشهر</div><div class="val">${money(sum(live,bookingTotal))}<small>ر.ق</small></div></div>
      </div>
      <div class="card"><h3>${new Date(Y,M-1,1).toLocaleDateString('ar-u-nu-latn',{month:'long',year:'numeric'})}</h3>
        <div class="card-sub">اضغطي على أي يوم لعرض مواعيده</div>
        <div class="cal">${dow.map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div></div>
      ${(function(){
        const ks=Object.keys(OM).filter(k=>k.slice(0,7)===m).sort();
        if(!ks.length) return '';
        return `<div class="card" style="margin-top:16px"><h3>مناسبات هذا الشهر</h3>
          <div class="card-sub">فرص لإطلاق عرض أو باقة قبلها بوقت كافٍ</div>
          ${ks.map(k=>OM[k].map(oc=>`<div class="alert-row">
            <span class="chip gold">${fdateShort(k)}</span>
            <span><b>${esc(oc.name)}</b>${oc.note?`<br><span style="font-size:12px;color:var(--muted)">${esc(oc.note)}</span>`:''}</span>
            <span class="qty" style="font-size:11.5px;color:var(--muted);font-weight:400">${occKindLabel(oc)}</span></div>`).join('')).join('')}
          <button class="btn ghost sm" style="margin-top:12px" data-act="occ-manage">إدارة المناسبات</button></div>`})()}`;
  }

  /* ---------- year overview ---------- */
  if(TAB.bk==='year'){
    const y=f.year||nowY;
    const years=[...new Set(all.map(b=>b.date.slice(0,4)).concat([nowY]))].sort().reverse();
    const OMy=occMap(+y);
    const months=[];
    for(let i=1;i<=12;i++){
      const mk=`${y}-${String(i).padStart(2,'0')}`;
      const bs=all.filter(b=>monthOf(b.date)===mk&&b.status!=='cancelled');
      const occ=Object.keys(OMy).filter(k=>k.slice(0,7)===mk).sort().reduce((a,k)=>a.concat(OMy[k]),[]);
      months.push({mk,i,n:bs.length,r:sum(bs,bookingTotal),done:bs.filter(b=>b.status==='done').length,occ});
    }
    const maxR=Math.max(1,...months.map(x=>x.r));
    const totalN=sum(months,x=>x.n), totalR=sum(months,x=>x.r);
    return headline+`
      <div class="filters">
        <select data-act="bf" data-k="year">${years.map(v=>`<option value="${v}" ${y===v?'selected':''}>${v}</option>`).join('')}</select>
      </div>
      <div class="grid g2" style="margin-bottom:16px">
        <div class="card stat"><div class="lbl">مواعيد السنة</div><div class="val">${totalN}</div></div>
        <div class="card stat accent"><div class="lbl">إجمالي السنة</div><div class="val">${money(totalR)}<small>ر.ق</small></div></div>
      </div>
      <div class="grid g4">${months.map(x=>`
        <div class="card month-card ${x.n?'':'off'}" data-act="open-month" data-m="${x.mk}">
          <div class="lbl" style="font-size:12px;color:var(--muted);font-weight:600">${new Date(+y,x.i-1,1).toLocaleDateString('ar-u-nu-latn',{month:'long'})}</div>
          <div class="val" style="font-family:var(--f-display);font-size:24px;margin-top:4px">${x.n}<small style="font-size:12px;color:var(--muted);font-family:var(--f-body)"> موعد</small></div>
          <div style="font-size:13px;margin-top:2px"><b>${money(x.r)}</b> <span style="color:var(--muted);font-size:11.5px">ر.ق</span></div>
          <div class="bar"><i style="width:${(x.r/maxR*100).toFixed(0)}%;background:var(--plum)"></i></div>
          <div style="font-size:11.5px;color:var(--muted);margin-top:5px">${x.done} منجزة</div>
          ${x.occ.length?`<div style="margin-top:8px;display:flex;gap:4px;flex-wrap:wrap">
            ${x.occ.map(oc=>`<span class="chip gold" style="font-size:10.5px">${esc(oc.name)}</span>`).join('')}</div>`:''}
        </div>`).join('')}</div>`;
  }

  /* ---------- full list ---------- */
  if(TAB.bk==='list'){
    const filtered=list.filter(b=>
      (!f.status||b.status===f.status)&&(!f.staff||b.staffId===f.staff)&&
      (!f.q||(b.client+' '+(b.phone||'')+' '+(b.area||'')).includes(f.q)));
    return headline+`<div class="filters">
      <input placeholder="بحث باسم الزبونة أو الرقم" value="${esc(f.q)}" data-act="bf" data-k="q">
      <select data-act="bf" data-k="status"><option value="">كل الحالات</option>
        ${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${f.status===k?'selected':''}>${v.ar}</option>`).join('')}</select>
      ${isOwner()?`<select data-act="bf" data-k="staff"><option value="">كل الفريق</option>${staffOpts}</select>`:''}
    </div>
    <div class="card"><div class="tbl-wrap"><table>
      <thead><tr><th>التاريخ</th><th>الوقت</th><th>الزبونة</th><th>الخدمات</th><th>المنطقة</th><th>الأخصائية</th><th>الإجمالي</th><th>الحالة</th><th></th></tr></thead>
      <tbody>${filtered.length?filtered.map(b=>{const st=ST[b.status]||ST.confirmed; return `<tr>
        <td class="num">${fdateShort(b.date)}</td><td class="num">${ftime(b.time)}</td>
        <td><b>${esc(b.client)}</b><br><span style="font-size:12px;color:var(--muted)">${esc(b.phone||'')}</span></td>
        <td style="font-size:13px;color:var(--muted)">${b.lines.map(l=>esc(l.name)).join('، ')}</td>
        <td>${esc(b.area||'—')}</td>
        <td><span class="dot" style="background:${staffColor(b.staffId)}"></span> ${esc(staffName(b.staffId))}</td>
        <td class="num"><b>${money(bookingTotal(b))}</b></td>
        <td><span class="chip ${st.c}">${st.ar}</span></td>
        <td><button class="btn quiet sm" data-act="bk-open" data-id="${b.id}">فتح</button></td></tr>`}).join('')
        :`<tr><td colspan="9"><div class="empty">لا توجد حجوزات مطابقة</div></td></tr>`}</tbody>
    </table></div></div>`;
  }

  /* ---------- day board (default) ---------- */
  const dayList=all.filter(b=>b.date===f.date).sort((a,b)=>a.time.localeCompare(b.time));
  const occToday=occMap(+f.date.slice(0,4))[f.date]||[];
  return headline+`${occToday.length?`<div class="occ-strip">
      ${occToday.map(oc=>`<b>${esc(oc.name)}</b>${oc.note?` — ${esc(oc.note)}`:''}`).join('<br>')}</div>`:''}
    <div class="filters">
      <input type="date" value="${f.date}" data-act="bf" data-k="date">
      <button class="btn quiet sm" data-act="bf-today">اليوم</button>
    </div>
    <div class="card"><h3>${fdate(f.date)}</h3>
      <div class="card-sub">${dayList.filter(b=>b.status!=='cancelled').length} موعد · إجمالي ${money(sum(dayList.filter(b=>b.status!=='cancelled'),bookingTotal))} ر.ق</div>
      ${rail(dayList)}</div>`;
}

function datesTab(f){
  const nowY=String(new Date().getFullYear());
  const y=f.year||nowY;
  const years=[String(+nowY-1),nowY,String(+nowY+1),String(+nowY+2)];
  const OM=occMap(+y);
  const all=visibleBookings();
  const items=Object.keys(OM).sort().reduce((a,k)=>a.concat(OM[k].map(o=>({d:k,o}))),[]);
  const t=today();
  const daysLeft=d=>Math.round((new Date(d+'T00:00')-new Date(t+'T00:00'))/86400000);
  const soon=items.filter(x=>x.d>=t).slice(0,3);
  const dayName=d=>{ try{ return new Date(d+'T00:00').toLocaleDateString('ar-u-nu-latn',{weekday:'long'}) }catch(e){ return '' } };
  const months=[];
  for(let i=1;i<=12;i++){
    const mk=`${y}-${String(i).padStart(2,'0')}`;
    months.push({mk,i,list:items.filter(x=>x.d.slice(0,7)===mk),
      bk:all.filter(b=>monthOf(b.date)===mk&&b.status!=='cancelled').length});
  }
  return `<div class="filters">
      <select data-act="bf" data-k="year">${years.map(v=>`<option value="${v}" ${y===v?'selected':''}>${v}</option>`).join('')}</select>
      <button class="btn quiet sm" data-act="occ-new">+ مناسبة جديدة</button>
      <button class="btn quiet sm" data-act="occ-manage">قائمة المناسبات</button>
    </div>
    ${soon.length?`<div class="card" style="margin-bottom:16px;border-color:var(--gold)">
      <h3>على الأبواب</h3><div class="card-sub">أقرب المناسبات — وقت الإعداد للعروض والباقات</div>
      <div class="grid g3">${soon.map(x=>{const n=daysLeft(x.d);
        return `<div class="soon-card" data-act="occ-edit" data-id="${x.o.id}">

/* ========== 7. INVENTORY ========== */
function vInventory(){
  const f=D.inf=D.inf||{q:'',cat:''};

  const list=S.items.filter(i=>(!f.cat||i.cat===f.cat)&&(!f.q||i.name.includes(f.q)));

  const low=lowStock();
  const moves=S.movements.slice().sort((a,b)=>b.at.localeCompare(a.at)).slice(0,25);

  const tabs=`<div class="tabs">

        return `<tr><td class="num">${fdateShort(m.at.slice(0,10))}</td><td>${esc(it?it.name:'—')}</td>
        <td><span class="chip ${m.type==='out'?'clay':'sage'}">${m.type==='out'?'صرف':'استلام'}</span></td>

        <td style="font-size:13px">${b?esc(b.client)+' · '+fdateShort(b.date):'—'}</td>
        <td style="font-size:13px;color:var(--muted)">${esc(m.note||'')}</td></tr>`}).join('')
        :`<tr><td colspan="7"><div class="empty">لا توجد حركات مسجّلة بعد</div></td></tr>`}</tbody></table></div></div>`;
  }

  return head('المخزون','الكميات المتوفّرة، مع تنبيه عند انخفاض الصنف عن الحد الأدنى',
    `<button class="btn quiet" data-act="mv-out">− صرف من المخزون</button>
     ${isOwner()?`<button class="btn quiet" data-act="mv-in">+ استلام بضاعة</button>
        <button class="btn quiet" data-act="imp-open">استيراد أصناف</button>
        <button class="btn" data-act="item-new">+ صنف جديد</button>`:''}`)
  +tabs
  +`<div class="grid g3" style="margin-bottom:16px">
      <div class="card stat"><div class="lbl">عدد الأصناف</div><div class="val">${S.items.length}</div></div>
      <div class="card stat"><div class="lbl">قيمة المخزون (المشتريات)</div><div class="val">${money(value)}<small>ر.ق</small></div>
        <div class="note">${giftValue>0?`+ ${money(giftValue)} ر.ق أصناف هدية خارج القيمة`:'لا توجد أصناف هدية'}</div></div>
      <div class="card stat"><div class="lbl">تحت الحد الأدنى</div><div class="val" style="color:${low.length?'var(--clay)':'inherit'}">${low.length}</div>
        <div class="note">${low.slice(0,3).map(i=>esc(i.name)).join('، ')||'—'}</div></div>
    </div>
    <div class="filters">
      <input placeholder="بحث عن صنف" value="${esc(f.q)}" data-act="inf" data-k="q">
      <select data-act="inf" data-k="cat"><option value="">كل الفئات</option>
        ${cats.map(c=>`<option value="${esc(c)}" ${f.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
    </div>
    <div class="card"><div class="tbl-wrap"><table>
      <thead><tr><th>الصنف</th><th>الفئة</th><th>المتوفر</th><th>الحد الأدنى</th><th>الحالة</th><th>سعر الشراء الأول</th><th>سعر الشراء الأخير</th><th>تكلفة الاستخدام</th><th>المتعاون</th><th></th></tr></thead>
      <tbody>${list.length?list.map(i=>{
        const ratio=Math.min(100,(i.qty/Math.max(1,i.min*2))*100);

        <td>${esc(i.cat)}</td><td class="num"><b>${i.qty}</b> ${esc(i.unit)}</td><td class="num">${i.min}</td>
        <td>${chip}</td>

        <td class="num"><b>${money(i.cost)}</b>

            return `<div style="font-size:11px;color:${up?'var(--clay)':'var(--sage)'}">${up?'▲':'▼'} ${pct.toFixed(0)}%</div>`})()}
          ${i.costAt?`<div style="font-size:11px;color:var(--muted)">${fdateShort(i.costAt)}</div>`:''}</td>
        <td class="num"><b>${money(costPerUse(i))}</b>
          <div style="font-size:11px;color:var(--muted)">${usesOf(i)} استخدام/عبوة</div></td><td style="font-size:13px">${esc(i.supplier||'—')}
          <div style="margin-top:3px;display:flex;gap:8px">
            ${i.url?`<a href="${esc(i.url)}" target="_blank" rel="noopener" style="font-size:11.5px">الموقع ↗</a>`:''}
            ${i.loc?(/^https?:/.test(i.loc)?`<a href="${esc(i.loc)}" target="_blank" rel="noopener" style="font-size:11.5px">الموقع ↗</a>`
              :`<span style="font-size:11.5px;color:var(--muted)">${esc(i.loc)}</span>`):''}
          </div></td>
        <td style="white-space:nowrap"><button class="btn quiet sm" data-act="mv-out" data-id="${i.id}">صرف</button>
        ${isOwner()?`<button class="btn quiet sm" data-act="item-edit" data-id="${i.id}">تعديل</button>`:''}</td></tr>`}).join('')
        :`<tr><td colspan="10"><div class="empty"><div class="big">لا توجد أصناف</div>ابدئي بإضافة أول صنف إلى المخزون</div></td></tr>`}</tbody>
    </table></div></div>`;
}

/* ========== 8. ACCOUNTING ========== */

    <button class="tab ${TAB.acc==='invoices'?'on':''}" data-act="tab" data-k="acc" data-v="invoices">الفواتير</button>
    ${isOwner()?`<button class="tab ${TAB.acc==='expenses'?'on':''}" data-act="tab" data-k="acc" data-v="expenses">المصروفات</button>
    <button class="tab ${TAB.acc==='report'?'on':''}" data-act="tab" data-k="acc" data-v="report">التقرير الشهري</button>

  if(TAB.acc==='report'&&isOwner()) return head('الفواتير والمحاسبة','صورة شاملة عن أداء الشهر','')+tabs+reportTab(f);
  if(TAB.acc==='settle'&&isOwner()) return head('الفواتير والمحاسبة','مساهمة كل شريكة والمبالغ المستحقّة بينهما','')+tabs+settleTab();

  const billed=sum(list,v=>v.total), paid=sum(list,v=>invPaid(v));
  return head('الفواتير والمحاسبة','كل فاتورة مرتبطة بحجزها، وأي تعديل على الخدمات ينعكس عليها',tools)+tabs
  +`<div class="grid g3" style="margin-bottom:16px">
      <div class="card stat"><div class="lbl">إجمالي الفواتير</div><div class="val">${money(billed)}<small>ر.ق</small></div><div class="note">${list.length} فاتورة</div></div>
      <div class="card stat"><div class="lbl">المحصّل</div><div class="val" style="color:var(--sage)">${money(paid)}<small>ر.ق</small></div></div>
      <div class="card stat"><div class="lbl">المتبقٍّ</div><div class="val" style="color:${billed-paid>0?'var(--clay)':'inherit'}">${money(billed-paid)}<small>ر.ق</small></div></div>
    </div>
    <div class="filters">
      <input type="month" value="${f.month}" data-act="af" data-k="month">
      <select data-act="af" data-k="status"><option value="">كل الحالات</option>
        ${Object.entries(PAYST).map(([k,v])=>`<option value="${k}" ${f.status===k?'selected':''}>${v.ar}</option>`).join('')}</select>
      <input placeholder="بحث برقم الفاتورة أو الاسم" value="${esc(f.q)}" data-act="af" data-k="q">
      <button class="btn quiet sm" data-act="af-clear">إلغاء الفلترة</button>

      <tbody>${list.length?list.map(v=>{const p=invPaid(v),st=PAYST[invStatus(v)];return `<tr>
        <td class="num" style="font-weight:600">${esc(v.no)}</td><td class="num">${fdateShort(v.date)}</td>

        <td class="num" style="color:${v.total-p>0.009?'var(--clay)':'var(--muted)'}">${money(v.total-p)}</td>
        <td><span class="chip ${st.c}">${st.ar}</span></td>
        <td><button class="btn quiet sm" data-act="inv-open" data-id="${v.id}">عرض</button></td></tr>`}).join('')
        :`<tr><td colspan="9"><div class="empty"><div class="big">لا توجد فواتير</div>تُنشأ الفاتورة تلقائياً عند إنهاء الحجز</div></td></tr>`}</tbody>
    </table></div></div>`;

  <div class="grid g-2-1">

      <div class="tbl-wrap"><table><thead><tr><th>التاريخ</th><th>البند</th><th>الفئة</th><th>المبلغ</th><th>دفعها من حسابه</th><th></th></tr></thead>
      <tbody>${list.length?list.map(e=>`<tr><td class="num">${fdateShort(e.date)}</td><td><b>${esc(e.note||'—')}</b></td>
        <td><span class="chip grey">${esc(e.cat)}</span></td><td class="num"><b>${money(e.amount)}</b></td>
        <td>${payerOf(e)?`<span class="dot" style="background:${staffColor(payerOf(e))}"></span> ${esc(staffName(payerOf(e)))}`

        <button class="btn quiet sm" data-act="exp-del" data-id="${e.id}">حذف</button></td></tr>`).join('')
        :`<tr><td colspan="6"><div class="empty">لا توجد مصروفات مسجّلة في هذا الشهر</div></td></tr>`}</tbody></table></div></div>
    <div class="card"><h3>حسب الفئة</h3><div class="card-sub">توزيع المصروفات حسب الفئة</div>
      ${Object.keys(byCat).length?Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`
        <div class="alert-row"><span>${esc(c)}</span><span class="qty num">${money(v)}</span></div>
        <div class="bar"><i style="width:${(v/total*100).toFixed(0)}%;background:var(--plum)"></i></div>`).join('')
        :'<div class="empty" style="padding:18px">—</div>'}</div>
  </div>`;
}
function reportTab(f){
  const m=f.month;
  const inv=S.invoices.filter(v=>monthOf(v.date)===m);
  const exp=S.expenses.filter(e=>monthOf(e.date)===m);
  const billed=sum(inv,v=>v.total), collected=sum(inv,v=>invPaid(v)), spent=sum(exp,e=>e.amount);
  const bks=S.bookings.filter(b=>monthOf(b.date)===m);
  const byStaff=S.users.map(u=>({u,c:bks.filter(b=>b.staffId===u.id&&b.status==='done').length,
    r:sum(inv.filter(v=>v.staffId===u.id),v=>v.total)})).filter(x=>x.c||x.r).sort((a,b)=>b.r-a.r);
  const svc={}; inv.forEach(v=>v.lines.forEach(l=>{svc[l.name]=svc[l.name]||{n:0,r:0}; svc[l.name].n+=l.qty; svc[l.name].r+=l.price*l.qty}));
  const top=Object.entries(svc).sort((a,b)=>b[1].r-a[1].r).slice(0,8);
  const maxR=top.length?top[0][1].r:1;
  return `<div class="filters"><input type="month" value="${m}" data-act="af" data-k="month">
    <button class="btn quiet sm" data-act="print">طباعة التقرير</button></div>
  <div class="grid g4" style="margin-bottom:16px">
    <div class="card stat accent"><div class="lbl">صافي الربح (محصّل − مصروف)</div><div class="val">${money(collected-spent)}<small>ر.ق</small></div></div>
    <div class="card stat"><div class="lbl">إجمالي الفواتير</div><div class="val">${money(billed)}<small>ر.ق</small></div></div>
    <div class="card stat"><div class="lbl">المحصّل</div><div class="val" style="color:var(--sage)">${money(collected)}<small>ر.ق</small></div>
      <div class="note">متبقٍّ ${money(billed-collected)} ر.ق</div></div>
    <div class="card stat"><div class="lbl">المصروفات</div><div class="val" style="color:var(--clay)">${money(spent)}<small>ر.ق</small></div></div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>أداء الفريق</h3><div class="card-sub">المواعيد المنجزة والإيراد لكل أخصائية</div>
      <table><thead><tr><th>الاسم</th><th>مواعيد منجزة</th><th>الإيراد</th></tr></thead>
      <tbody>${byStaff.length?byStaff.map(x=>`<tr><td><span class="dot" style="background:${x.u.color}"></span> <b>${esc(x.u.name)}</b>
        <div style="font-size:12px;color:var(--muted)">${esc(x.u.title||'')}</div></td>
        <td class="num">${x.c}</td><td class="num"><b>${money(x.r)}</b></td></tr>`).join('')
        :`<tr><td colspan="3"><div class="empty">لا توجد بيانات لهذا الشهر</div></td></tr>`}</tbody></table></div>
    <div class="card"><h3>الخدمات الأكثر دخلاً</h3><div class="card-sub">بحسب الفواتير الصادرة</div>
      ${top.length?top.map(([n,v])=>`<div style="margin-bottom:10px">
        <div class="alert-row" style="border:0;padding:2px 0"><span>${esc(n)} <span style="color:var(--muted);font-size:12px">×${v.n}</span></span>
        <span class="qty num">${money(v.r)}</span></div>
        <div class="bar"><i style="width:${(v.r/maxR*100).toFixed(0)}%;background:var(--gold)"></i></div></div>`).join('')
        :'<div class="empty">لا توجد فواتير في هذا الشهر</div>'}</div>
  </div>`;
}

/* ========== 9. CLIENTS ========== */
function vClients(){
  const f=D.cf=D.cf||{q:''};
  const rows=S.clients.map(c=>{
    const bs=S.bookings.filter(b=>(b.phone&&b.phone===c.phone)||b.client===c.name);
    const done=bs.filter(b=>b.status==='done');
    const spent=sum(S.invoices.filter(v=>done.some(b=>b.id===v.bookingId)),v=>v.total)
               +sum(S.subs.filter(x=>(x.phone&&x.phone===c.phone)||x.client===c.name),x=>x.price);
    const last=bs.map(b=>b.date).sort().pop();
    const subs=activeSubs(c.name,c.phone);
    return {c,visits:done.length,upcoming:bs.filter(b=>b.date>=today()&&b.status!=='cancelled'&&b.status!=='done').length,spent,last,subs};
  }).filter(r=>!f.q||(r.c.name+' '+(r.c.phone||'')).includes(f.q)).sort((a,b)=>b.spent-a.spent);
  return head('الزبائن','اضغطي على اسم الزبونة لعرض ملفّها الكامل','')
  +`<div class="filters"><input placeholder="بحث بالاسم أو الرقم" value="${esc(f.q)}" data-act="cf" data-k="q"></div>
    <div class="card"><div class="tbl-wrap"><table>
    <thead><tr><th>الزبونة</th><th>الجوال</th><th>المنطقة</th><th>زيارات</th><th>باقة نشطة</th><th>حجوزات قادمة</th><th>إجمالي الصرف</th><th>آخر زيارة</th></tr></thead>
    <tbody>${rows.length?rows.map(r=>`<tr><td>
      <button class="cl-link" data-act="cl-open" data-id="${r.c.id}">${esc(r.c.name)}</button></td><td class="num">${esc(r.c.phone||'—')}</td>
      <td>${esc(r.c.area||'—')}</td><td class="num">${r.visits}</td>
      <td>${r.subs.length?r.subs.map(s=>`<span class="chip sage">${esc(s.packageName)} · ${s.sessions-s.used} متبقٍّة</span>`).join(' '):'—'}</td>
      <td>${r.upcoming?`<span class="chip plum">${r.upcoming}</span>`:'—'}</td>
      <td class="num"><b>${money(r.spent)}</b></td><td class="num">${r.last?fdateShort(r.last):'—'}</td></tr>`).join('')
      :`<tr><td colspan="8"><div class="empty">لا توجد زبونات بعد — تُسجَّل تلقائياً مع أول حجز</div></td></tr>`}</tbody>
    </table></div></div>`;
}

  const tabs=`<div class="tabs">
    <button class="tab ${TAB.sv!=='pkg'?'on':''}" data-act="tab" data-k="sv" data-v="list">الخدمات المفردة</button>

async function saveBooking(silent){
  harvestB(); const b=D.b;
  if(!b.client){ toast('أدخلي اسم الزبونة'); return false }
  if(!b.lines.length){ toast('أضيفي خدمة واحدة على الأقل'); return false }
  if(b.id){ const i=S.bookings.findIndex(x=>x.id===b.id); S.bookings[i]=JSON.parse(JSON.stringify(b)) }
  else { b.id=uid('b'); S.bookings.push(JSON.parse(JSON.stringify(b))) }
  const stored=byId(S.bookings,b.id);
  const c=upsertClient(stored), v=syncInvoice(stored);
  await put('bookings',stored); if(c) await put('clients',c); if(v) await put('invoices',v);
  if(!silent){ close(); render(); toast('تم حفظ الحجز') }
  return true;
}

/* ========== 12F. COST & MARGIN ========== */
const USES_DEFAULT=15;
const usesOf=i=>Math.max(1,+((i&&i.usesPerPack)||USES_DEFAULT));
const costPerUse=i=>i?(+i.cost||0)/usesOf(i):0;
function catAvgCost(cat){
  const list=S.items.filter(i=>i.cat===cat);
  if(!list.length) return 0;
  return sum(list,i=>costPerUse(i))/list.length;
}
function recipeUnit(r){
  if(r.grp) return catAvgCost(r.grp);
  const it=byId(S.items,r.itemId); return it?costPerUse(it):0;
}
function recipeLabel(r){
  if(r.grp) return 'أي صنف من: '+r.grp;
  const it=byId(S.items,r.itemId); return it?it.name:'صنف محذوف';
}
function serviceCost(s){
  return sum((s&&s.recipe)||[],r=>recipeUnit(r)*Math.max(1,+r.uses||1));
}
function serviceProfit(s){
  const c=serviceCost(s), p=+((s&&s.price))||0;
  return {cost:c, profit:p-c, pct:p>0?((p-c)/p*100):0, has:!!(s&&s.recipe&&s.recipe.length)};
}
function marginChip(x){
  if(!x.has) return '<span class="chip grey">لم تُحدَّد المواد</span>';
  const cl=x.pct>=60?'sage':(x.pct>=40?'gold':'clay');
  return `<span class="chip ${cl}">${x.pct.toFixed(0)}%</span>`;
}

function activeSubs(client,phone){
  return (S.subs||[]).filter(x=>(((phone&&x.phone&&x.phone===phone))||x.client===client)
    && ((x.sessions||0)-(x.used||0))>0 && (!x.expiry||x.expiry>=today()));
}
function pkgBox(b){
  let extra='';
  if(b.newPkgId){
    const p=byId(S.packages,b.newPkgId);
    if(p) extra=`<div style="background:var(--plum-soft);color:var(--plum-dark);padding:11px 13px;border-radius:var(--r-sm);
      font-size:13.5px;margin-bottom:14px">تُباع باقة <b>${esc(p.name)}</b> مع هذا الموعد — وعند إنهائه يُفتح للزبونة رصيد
      <b>${p.sessions} جلسات</b> (واحدة منها لهذه الزيارة) وتُخصم تلقائياً في الزيارات القادمة.</div>`;
  }
  if(b.subId){
    const s=byId(S.subs,b.subId);
    return `<div style="background:var(--sage-soft);color:var(--sage);padding:11px 13px;border-radius:var(--r-sm);
      font-size:13.5px;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span>هذا الموعد على حساب باقة <b>${esc(s?s.packageName:'')}</b> — تُخصم جلسة واحدة عند الإنهاء.</span>
      <button class="btn quiet sm" data-act="pkg-clear" style="margin-inline-start:auto">إلغاء استخدام الباقة</button></div>`+extra;
  }
  const subs=activeSubs(b.client,b.phone);
  if(!subs.length) return extra;
  return extra+`<div style="background:var(--gold-soft);padding:11px 13px;border-radius:var(--r-sm);font-size:13.5px;margin-bottom:14px">
    <b style="color:#8A6415">لدى الزبونة باقة مدفوعة:</b>
    ${subs.map(s=>`<div style="display:flex;align-items:center;gap:10px;margin-top:7px;flex-wrap:wrap">
      <span>${esc(s.packageName)} — متبقٍّ <b>${(s.sessions||0)-(s.used||0)}</b> جلسة${s.expiry?` · تنتهي ${fdateShort(s.expiry)}`:''}</span>
      <button class="btn gold sm" data-act="pkg-use" data-sub="${s.id}" style="margin-inline-start:auto">استخدام جلسة</button></div>`).join('')}
  </div>`;
}

  const p=D.p; if(!document.getElementById('pName')) return;
  p.name=val('pName'); p.price=numv('pPrice'); p.sessions=Math.max(1,numv('pSessions')||1);
  p.validMonths=numv('pValid'); p.note=val('pNote');
}
function renderPackage(){
  const p=D.p;
  const per=sum(p.lines,l=>l.price*(l.qty||1)), full=per*Math.max(1,p.sessions||1);
  const lines=p.lines.length?p.lines.map((l,i)=>`<div class="line"><span class="nm">${esc(l.name)}</span>

      <button class="rm" data-act="pln-rm" data-i="${i}">×</button></div>`).join('')
    :`<div class="line-empty">أضيفي الخدمات المشمولة في الباقة</div>`;

async function finishBooking(id){
  const b=byId(S.bookings,id); if(!b) return;
  b.status='done';
  if(b.subId&&!b.subCounted){
    const s=byId(S.subs,b.subId);
    if(s){ s.used=(s.used||0)+1; b.subCounted=true; await put('subs',s) }
  }
  if(b.newPkgId&&!b.subCreated){
    const p=byId(S.packages,b.newPkgId);
    if(p&&(p.sessions||1)>1){
      const months=+p.validMonths||0; let expiry='';
      if(months){ const d=new Date(b.date+'T00:00'); d.setMonth(d.getMonth()+months); expiry=d.toLocaleDateString('sv-SE') }
      const sub={id:uid('k'),client:b.client,phone:b.phone,packageId:p.id,packageName:p.name,
        sessions:p.sessions,used:1,price:p.price,date:b.date,expiry:expiry,
        lines:JSON.parse(JSON.stringify(p.lines)),by:ME.name};
      S.subs.push(sub); await put('subs',sub);
    }
    b.subCreated=true;
  }
  const v=syncInvoice(b);
  await put('bookings',b); await put('invoices',v);
  close(); render();
  toast('تم إنهاء الموعد وإصدار الفاتورة '+v.no);
  openInvoice(v.id);
}

const PRIO={high:{ar:'عاجلة',c:'clay'},normal:{ar:'عادية',c:'plum'},low:{ar:'عند التيسّر',c:'grey'}};
const TST={open:{ar:'جديدة'},doing:{ar:'جاري العمل'},done:{ar:'منجزة'}};
const myTasks=()=>(S.tasks||[]).filter(t=>t.assignee===ME.id&&t.status!=='done');
function taskSort(a,b){
  const p={high:0,normal:1,low:2};
  if((p[a.prio]||1)!==(p[b.prio]||1)) return (p[a.prio]||1)-(p[b.prio]||1);
  return (a.due||'9999').localeCompare(b.due||'9999');
}
function taskCard(t){
  const late=t.due&&t.due<today()&&t.status!=='done';

      ${t.due?`<span class="chip ${late?'clay':(soon?'gold':'grey')}">${late?'متأخرة · ':(soon?'اليوم · ':'')}${fdateShort(t.due)}</span>`:''}

const HJ_M=['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];
const GR_M=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const HJ_CACHE={};
function hijriMap(year){
  if(HJ_CACHE[year]) return HJ_CACHE[year];
  const map={};
  try{
    const fmt=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{day:'numeric',month:'numeric',year:'numeric',timeZone:'UTC'});
    const d=new Date(Date.UTC(year,0,1));
    while(d.getUTCFullYear()===year){
      const p=fmt.formatToParts(d);
      const m=+p.find(x=>x.type==='month').value, dd=+p.find(x=>x.type==='day').value;
      const k=m+'-'+dd; if(!map[k]) map[k]=d.toISOString().slice(0,10);
      d.setUTCDate(d.getUTCDate()+1);
    }
  }catch(e){}
  HJ_CACHE[year]=map; return map;
}
function occDate(o,y){
  if(!o) return '';
  if(o.kind==='once') return (o.date&&o.date.slice(0,4)===String(y))?o.date:'';
  if(o.kind==='fixed') return y+'-'+o.md;
  if(o.kind==='nth'){
    const first=new Date(y,o.month-1,1);
    const day=1+((o.dow-first.getDay()+7)%7)+((o.nth||1)-1)*7;
    const d=new Date(y,o.month-1,day);
    return d.getMonth()===o.month-1?d.toLocaleDateString('sv-SE'):'';
  }
  if(o.kind==='hijri') return hijriMap(y)[o.hm+'-'+o.hd]||'';
  return '';
}
function occMap(y){
  const m={};
  (S.occasions||[]).forEach(o=>{ const d=occDate(o,y); if(d){ (m[d]=m[d]||[]).push(o) } });
  return m;
}
function occKindLabel(o){
  if(o.kind==='hijri') return 'هجرية · '+HJ_M[o.hm-1]+' '+o.hd;
  if(o.kind==='once') return 'مرة واحدة';
  if(o.kind==='nth') return 'محسوبة تلقائياً';
  return 'سنوية ثابتة';
}

function payerOf(e){
  if(e.payer) return e.payer;
  const u=S.users.find(x=>x.name===e.by);
  return u?u.id:'';
}
function partnerStats(){
  const owners=S.users.filter(u=>u.role==='owner');
  const shares=(S.settings&&S.settings.shares)||{};
  const tot=owners.reduce((a,u)=>a+(+shares[u.id]||0),0);
  const shareOf=u=>u.role!=='owner'?0:(tot>0?(+shares[u.id]||0)/tot:(owners.length?1/owners.length:0));
  const E=sum(S.expenses,e=>e.amount);
  const unknown=sum(S.expenses.filter(e=>!payerOf(e)),e=>e.amount);
  const rows=S.users.map(u=>{
    const paid=sum(S.expenses.filter(e=>payerOf(e)===u.id),e=>e.amount);
    const out=sum((S.settles||[]).filter(t=>t.from===u.id),t=>t.amount);
    const inn=sum((S.settles||[]).filter(t=>t.to===u.id),t=>t.amount);
    const duty=E*shareOf(u);
    return {u,paid,out,inn,duty,pct:shareOf(u)*100,net:paid+out-inn-duty};
  }).filter(r=>r.u.role==='owner'||r.paid||r.out||r.inn);
  return {rows,E,unknown};
}
function settleSuggest(rows){
  const cred=rows.filter(r=>r.net>0.5).map(r=>({u:r.u,amt:r.net})).sort((a,b)=>b.amt-a.amt);
  const debt=rows.filter(r=>r.net<-0.5).map(r=>({u:r.u,amt:-r.net})).sort((a,b)=>b.amt-a.amt);
  const out=[]; let i=0,j=0;
  while(i<debt.length&&j<cred.length){
    const m=Math.min(debt[i].amt,cred[j].amt);
    out.push({from:debt[i].u,to:cred[j].u,amt:m});
    debt[i].amt-=m; cred[j].amt-=m;
    if(debt[i].amt<0.5) i++;
    if(cred[j].amt<0.5) j++;
  }
  return out;
}

function clientData(c){
  const bs=S.bookings.filter(b=>(c.phone&&b.phone===c.phone)||b.client===c.name)
    .sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  const ids=new Set(bs.map(b=>b.id));
  const invs=S.invoices.filter(v=>ids.has(v.bookingId)||((c.phone&&v.phone===c.phone)||v.client===c.name));
  const done=bs.filter(b=>b.status==='done');
  const spent=sum(invs,v=>v.total), paid=sum(invs,v=>invPaid(v));
  const svc={}; done.forEach(b=>b.lines.forEach(l=>{ if(!l.inc) svc[l.name]=(svc[l.name]||0)+(l.qty||1) }));
  const byStaff={}; done.forEach(b=>byStaff[b.staffId]=(byStaff[b.staffId]||0)+1);
  const subs=(S.subs||[]).filter(x=>(c.phone&&x.phone===c.phone)||x.client===c.name);
  const upcoming=bs.filter(b=>b.date>=today()&&b.status!=='cancelled'&&b.status!=='done');
  const mats={};
  S.movements.filter(m=>m.bookingId&&ids.has(m.bookingId)).forEach(m=>{
    const it=byId(S.items,m.itemId); if(it) mats[it.name]=(mats[it.name]||0)+m.qty });
  return {bs,invs,done,spent,paid,svc,byStaff,subs,upcoming,mats,
    first:bs.length?bs[bs.length-1].date:'', last:done.length?done[0].date:''};
}
