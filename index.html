/* ========== 13. ACTIONS ========== */
const FILT={bf:'bf',inf:'inf',af:'af',cf:'cf',tf:'tf'};
function setFilter(key,k,v,refocus){
  D[key]=D[key]||{}; D[key][k]=v; render();
  if(refocus){ const el=document.querySelector(`[data-act="${key}"][data-k="${k}"]`);
    if(el){ el.focus(); try{ el.setSelectionRange(el.value.length,el.value.length) }catch(e){} } }
}
document.addEventListener('input',e=>{
  if(e.target && e.target.id==='consFind'){
    const q=e.target.value.trim();
    document.querySelectorAll('.cons-row').forEach(r=>{
      r.style.display = (!q || (r.dataset.name||'').includes(q)) ? '' : 'none';
    });
    document.querySelectorAll('.cons-cat').forEach(h=>{
      let n=h.nextElementSibling, any=false;
      while(n && n.classList.contains('cons-row')){ if(n.style.display!=='none') any=true; n=n.nextElementSibling }
      h.style.display = any ? '' : 'none';
    });
    return;
  }
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;
  if(FILT[a]&&el.tagName==='INPUT'&&(!el.type||el.type==='text')) setFilter(a,el.dataset.k,el.value,true);
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;
  if(a==='imp-preset'){
    const t=document.getElementById('impText'), sup=document.getElementById('impSup');
    if(el.value==='koa'){ if(t) t.value=IMPORT_SEED_KOA; if(sup) sup.value='Reflect Trading' }
    else if(el.value==='shein'){ if(t) t.value=IMPORT_SEED_SHEIN; if(sup) sup.value='SHEIN' }
    else if(el.value==='shein2'){ if(t) t.value=IMPORT_SEED_SHEIN2; if(sup) sup.value='SHEIN — طلبية 2' }
    else if(el.value==='shein3'){ if(t) t.value=IMPORT_SEED_SHEIN3; if(sup) sup.value='SHEIN — طلبية 3' }
    else { if(t) t.value=''; if(sup) sup.value='' }
    return;
  }
  if(a==='mv-item'||a==='mv-calc'){
    const it=byId(S.items,val('mItem'));
    const unitEl=document.getElementById('mUnit');
    if(it&&unitEl){
      if(a==='mv-item') unitEl.value=it.cost;
      const hint=document.getElementById('mHint');
      if(hint) hint.textContent='السعر المسجّل سابقاً: '+money(it.cost)+' ر.ق للوحدة';
      const tot=document.getElementById('mTotal');
      if(tot) tot.textContent='الإجمالي: '+money((parseFloat(unitEl.value)||0)*(parseFloat(val('mQty'))||1))+' ر.ق';
    }
    return;
  }
  if(a==='exp-item'||a==='exp-qty'){
    const it=byId(S.items,val('eItem'));
    const amtEl=document.getElementById('eAmt'), noteEl=document.getElementById('eNote'),
          catEl=document.getElementById('eCat'), qty=Math.max(1,parseFloat(val('eQty'))||1);
    if(it&&amtEl){
      amtEl.value=(it.cost*qty).toFixed(2);
      if(noteEl&&(!noteEl.value||a==='exp-item')) noteEl.value=it.name+(qty>1?' ×'+qty:'');
      if(catEl&&a==='exp-item') catEl.value='بضاعة ومستلزمات';
      const h=document.getElementById('eHint');
      if(h) h.textContent='السعر المسجّل للوحدة: '+money(it.cost)+' ر.ق — عدّلي المبلغ إذا اختلف السعر، وسيُحدَّث سعر الصنف تلقائياً.';
    }
    return;
  }
  if(a==='occ-kind'){
    const k=el.value;
    ['oFixed','oHijri','oOnce'].forEach((sec,i)=>{
      const node=document.getElementById(sec);
      if(node) node.classList.toggle('hidden',k!==['fixed','hijri','once'][i]);
    });
    return;
  }
  if(FILT[a]&&(el.tagName==='SELECT'||(el.type&&el.type!=='text'))) setFilter(a,el.dataset.k,el.value,false);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.getElementById('modal-host').innerHTML) close();
  if(e.key==='Enter'&&!ME&&CFG&&document.getElementById('lu')) doLogin();
  if(e.key==='Enter'&&!CFG&&document.getElementById('cfgUrl')) saveCfg();
});

function saveCfg(){
  let url=val('cfgUrl').replace(/\/+$/,''), key=val('cfgKey');
  if(!/^https?:\/\//.test(url)||!key){ root().innerHTML=setupView('يُرجى التحقق من الرابط والمفتاح'); return }
  CFG={url,key}; LS.set(CFGK,CFG); render(); toast('تم حفظ إعدادات الاتصال');
}
async function doLogin(){
  const btn=document.getElementById('loginBtn'); const u=val('lu'), p=val('lp');
  if(!u||!p){ root().innerHTML=loginView('أدخلي اسم المستخدم وكلمة المرور'); return }
  if(btn){ btn.textContent='جارٍ تسجيل الدخول…'; btn.disabled=true }
  try{
    const s=await signIn(u,p);
    await afterAuth(s.user?s.user.id:(s.id));
    toast('أهلاً  '+(ME?ME.name:''));
  }catch(e){
    const msg=/Invalid login/i.test(e.message)?'اسم المستخدم أو كلمة المرور غير صحيحة':e.message;
    root().innerHTML=loginView(msg); const f=document.getElementById('lu'); if(f) f.value=u;
  }
}

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id;
  if(a==='ovl'&&e.target!==el) return;
  if(a==='cfg-reset') e.preventDefault();

  try{
  switch(a){
    case 'cfg-save': saveCfg(); break;
    case 'cfg-reset': LS.del(CFGK); CFG=null; signOutLocal(); render(); break;
    case 'login': await doLogin(); break;
    case 'logout': signOutLocal(); D={}; close(); render(); break;
    case 'nav': VIEW=el.dataset.v; close(); render(); break;
    case 'tab': TAB[el.dataset.k]=el.dataset.v; render(); break;
    case 'ovl': case 'close': close(); break;
    case 'print': window.print(); break;
    case 'bf-today': setFilter('bf','date',today()); break;
    case 'bf-mshift': {
      const m=(D.bf&&D.bf.month)||monthOf(today());
      const d=new Date(+m.slice(0,4),+m.slice(5,7)-1+(+el.dataset.s),1);
      setFilter('bf','month',d.toLocaleDateString('sv-SE').slice(0,7)); break; }
    case 'open-day': { D.bf=D.bf||{}; D.bf.date=el.dataset.d; TAB.bk='day'; render(); break; }
    case 'open-month': { D.bf=D.bf||{}; D.bf.month=el.dataset.m; TAB.bk='month'; render(); break; }
    case 'af-clear': D.af={month:'',status:'',q:''}; render(); break;
    case 'sync': try{ await pull(); render(); toast('تم تحديث البيانات') }catch(err){ toast('تعذّرت المزامنة') } break;
    case 'pwd': openPwd(); break;
    case 'pwd-save': {
      const n=val('wNew');
      if(n.length<6){ toast('كلمة المرور يجب ألا تقل عن 6 خانات'); break }
      if(n!==val('wNew2')){ toast('كلمتا المرور غير متطابقتين'); break }
      await api('/auth/v1/user',{method:'PUT',body:JSON.stringify({password:n})});
      close(); toast('تم تغيير كلمة المرور'); break; }

    /* bookings */
    case 'bk-new': openBooking(null); break;
    case 'bk-open': openBooking(id); break;
    case 'bk-save': await saveBooking(); break;
    case 'ln-add': {
      harvestB(); const sid=val('bSvc'), q=Math.max(1,parseInt(val('bQty'),10)||1);
      if(sid.indexOf('p:')===0){
        const p=byId(S.packages,sid.slice(2)); if(!p) break;
        if(D.b.lines.some(l=>l.pkgSale&&l.pid===p.id)){ toast('الباقة مُضافة مسبقاً'); break }
        const n=p.sessions||1;
        D.b.lines.push({sid:sid,pid:p.id,pkgSale:true,price:p.price,qty:1,
          name:'باقة: '+p.name+(n>1?' ('+n+' جلسات)':'')});
        (p.lines||[]).forEach(l=>D.b.lines.push({sid:l.sid,pid:p.id,inc:true,price:0,qty:l.qty||1,name:l.name}));
        if(n>1) D.b.newPkgId=p.id;
        renderBooking(); break;
      }
      const s=byId(S.services,sid); if(!s) break;
      const ex=D.b.lines.find(l=>l.sid===sid);
      if(ex) ex.qty=(ex.qty||1)+q; else D.b.lines.push({sid:s.id,name:s.name,price:s.price,qty:q});
      renderBooking(); break; }
    case 'ln-rm': {
      harvestB(); const gone=D.b.lines[+el.dataset.i];
      D.b.lines.splice(+el.dataset.i,1);
      if(gone&&gone.pkgSale){
        D.b.lines=D.b.lines.filter(l=>!(l.inc&&l.pid===gone.pid));
        if(D.b.newPkgId===gone.pid) D.b.newPkgId='';
      }
      renderBooking(); break; }
    case 'bk-done': {
      if(!await saveBooking(true)) break;
      openConsume(D.b.id); break; }
    case 'bk-cancel': {
      if(!confirm('هل تريدين إلغاء هذا الحجز؟')) break;
      const b=byId(S.bookings,D.b.id); b.status='cancelled';
      await put('bookings',b); close(); render(); toast('تم إلغاء الحجز'); break; }
    case 'bk-del': {
      if(!confirm('حذف الحجز نهائياً؟ ستُحذف الفاتورة المرتبطة به أيضاً.')) break;
      const bid=D.b.id, vids=S.invoices.filter(v=>v.bookingId===bid).map(v=>v.id);
      S.bookings=S.bookings.filter(x=>x.id!==bid); S.invoices=S.invoices.filter(v=>v.bookingId!==bid);
      await rm(bid); for(const vid of vids) await rm(vid);
      close(); render(); toast('تم حذف الحجز'); break; }

    /* client profile */
    case 'cl-open': openClient(id); break;
    case 'cl-save': {
      const c=byId(S.clients,id); if(!c) break;
      const nm=val('clName'); if(!nm){ toast('لا يمكن ترك الاسم فارغاً'); break }
      Object.assign(c,{name:nm,phone:val('clPhone'),area:val('clArea'),notes:val('clNotes')});
      await put('clients',c); close(); render(); toast('تم حفظ بيانات الزبونة'); break; }
    case 'cl-del': {
      if(!confirm('حذف الزبونة منذ القائمة؟ حجوزاتها وفواتيرها بتبقى محفوظة.')) break;
      S.clients=S.clients.filter(x=>x.id!==id); await rm(id); close(); render(); break; }
    case 'cl-book': {
      const c=byId(S.clients,id); if(!c) break;
      openBooking(null);
      D.b.client=c.name; D.b.phone=c.phone||''; D.b.area=c.area||'';
      renderBooking(); break; }

    /* partner settlement */
    case 'stl-new': openSettle(el.dataset.from,el.dataset.to,el.dataset.amt); break;
    case 'stl-save': {
      const from=val('yFrom'), to=val('yTo'), amt=numv('yAmt');
      if(from===to){ toast('اختاري شريكتين مختلفتين'); break }
      if(amt<=0){ toast('أدخلي مبلغاً صحيحاً'); break }
      const t={id:uid('y'),from:from,to:to,amount:amt,date:val('yDate')||today(),
        method:val('yMethod'),note:val('yNote'),by:ME.name};
      S.settles.push(t); await put('settles',t);
      close(); render(); toast('تم تسجيل التسوية'); break; }
    case 'stl-del': {
      if(!confirm('حذف التسوية؟')) break;
      S.settles=S.settles.filter(x=>x.id!==id); await rm(id); render(); break; }
    case 'shares-open': openShares(); break;
    case 'shares-save': {
      const owners=S.users.filter(u=>u.role==='owner');
      const sh={}; let t=0;
      owners.forEach(u=>{ const v=numv('sh_'+u.id); sh[u.id]=v; t+=v });
      if(Math.round(t)!==100){ toast('يجب أن يكون المجموع 100 — القيمة الحالية — الحين '+t); break }
      S.settings.shares=sh; await putSettings();
      close(); render(); toast('تم حفظ النسب'); break; }

    /* occasions */
    case 'occ-manage': openOccasions(); break;
    case 'occ-new': openOccasion(null); break;
    case 'occ-edit': openOccasion(id); break;
    case 'occ-save': {
      const name=val('oName'); if(!name){ toast('أدخلي اسم المناسبة'); break }
      const kind=val('oKind');
      const o=id?byId(S.occasions,id):{id:uid('o')};
      o.name=name; o.note=val('oNote');
      if(kind!=='nth'){
        o.kind=kind;
        if(kind==='fixed') o.md=String(numv('oMon')||1).padStart(2,'0')+'-'+String(numv('oDay')||1).padStart(2,'0');
        if(kind==='hijri'){ o.hm=numv('oHm')||1; o.hd=numv('oHd')||1 }
        if(kind==='once') o.date=val('oDate');
      }
      if(!id) S.occasions.push(o);
      await put('occasions',o); close(); render(); openOccasions(); toast('تم حفظ المناسبة'); break; }
    case 'occ-del': {
      if(!confirm('حذف المناسبة؟')) break;
      S.occasions=S.occasions.filter(x=>x.id!==id); await rm(id); close(); render(); openOccasions(); break; }
    case 'occ-kind': break;

    /* tasks */
    case 'task-new': openTask(null); break;
    case 'task-open': openTask(id); break;
    case 'task-quick': {
      const title=val('tqTitle'); if(!title){ toast('أدخلي عنوان المهمة'); break }
      const t={id:uid('t'),title:title,note:'',assignee:val('tqWho'),due:val('tqDue'),prio:'normal',
        status:'open',by:ME.name,createdAt:new Date().toISOString(),doneAt:''};
      S.tasks.push(t); await put('tasks',t); render(); toast('تمت إضافة المهمة'); break; }
    case 'task-toggle': {
      const t=byId(S.tasks,id); if(!t) break;
      if(t.status==='done'){ t.status='open'; t.doneAt='' } else { t.status='done'; t.doneAt=new Date().toISOString() }
      await put('tasks',t); render(); break; }
    case 'task-save': {
      const title=val('tTitle'); if(!title){ toast('أدخلي عنوان المهمة'); break }
      const st=val('tStatus');
      let t;
      if(id){ t=byId(S.tasks,id) } else { t={id:uid('t'),by:ME.name,createdAt:new Date().toISOString(),doneAt:''}; S.tasks.push(t) }
      if(isOwner()){ Object.assign(t,{title:title,note:val('tNote'),assignee:val('tWho'),due:val('tDue'),prio:val('tPrio')}) }
      if(st==='done'&&t.status!=='done') t.doneAt=new Date().toISOString();
      if(st!=='done') t.doneAt='';
      t.status=st;
      await put('tasks',t); close(); render(); toast('تم حفظ المهمة'); break; }
    case 'task-del': {
      if(!confirm('حذف المهمة؟')) break;
      S.tasks=S.tasks.filter(x=>x.id!==id); await rm(id); close(); render(); toast('تم حذف المهمة'); break; }

    /* service cost & recipe */
    case 'sln-add': {
      harvestS(); const v=val('sItem'), u=Math.max(1,parseInt(val('sUses'),10)||1);
      if(v.indexOf('g:')===0){
        const g=v.slice(2);
        const ex=D.s.recipe.find(r=>r.grp===g);
        if(ex) ex.uses=(+ex.uses||1)+u; else D.s.recipe.push({grp:g,uses:u});
        renderService(); break;
      }
      const it=byId(S.items,v);
      if(!it){ toast('اختاري صنفاً من المخزون'); break }
      const ex=D.s.recipe.find(r=>r.itemId===it.id);
      if(ex) ex.uses=(+ex.uses||1)+u; else D.s.recipe.push({itemId:it.id,uses:u});
      renderService(); break; }
    case 'sln-rm': harvestS(); D.s.recipe.splice(+el.dataset.i,1); renderService(); break;
    case 'svc-suggest': {
      harvestS();
      const t=Math.min(95,Math.max(1,numv('sTarget')||70));
      const c=serviceCost(D.s);
      const price=c>0?Math.ceil((c/(1-t/100))/5)*5:0;
      const out=document.getElementById('sSuggest');
      if(!c) { if(out) out.textContent='أضيفي المواد أولاً لحساب التكلفة'; break }
      const pe=document.getElementById('sPrice'); if(pe) pe.value=price;
      if(out) out.textContent=`السعر المقترح ${money(price)} ر.ق (التكلفة ${money(c)})`;
      break; }

    /* packages */
    case 'pkg-new': openPackage(null); break;
    case 'pkg-edit': openPackage(id); break;
    case 'pln-add': {
      harvestP(); const s=byId(S.services,val('pSvc')), q=Math.max(1,parseInt(val('pQty'),10)||1);
      if(!s) break;
      const ex=D.p.lines.find(l=>l.sid===s.id);
      if(ex) ex.qty=(ex.qty||1)+q; else D.p.lines.push({sid:s.id,name:s.name,price:s.price,qty:q});
      renderPackage(); break; }
    case 'pln-rm': harvestP(); D.p.lines.splice(+el.dataset.i,1); renderPackage(); break;
    case 'pkg-save': {
      harvestP(); const p=D.p;
      if(!p.name){ toast('أدخلي اسم الباقة'); break }
      if(!p.lines.length){ toast('أضيفي خدمة واحدة على الأقل إلى الباقة'); break }
      if(!p.id){ p.id=uid('p'); S.packages.push(JSON.parse(JSON.stringify(p))) }
      else { const i=S.packages.findIndex(x=>x.id===p.id); S.packages[i]=JSON.parse(JSON.stringify(p)) }
      await put('packages',byId(S.packages,p.id)); close(); render(); toast('تم حفظ الباقة'); break; }
    case 'pkg-del': {
      if(!confirm('حذف الباقة؟ ستبقى الباقات المباعة للزبونات سارية.')) break;
      const pid=id||(D.p&&D.p.id); S.packages=S.packages.filter(x=>x.id!==pid); await rm(pid);
      close(); render(); toast('تم حذف الباقة'); break; }
    case 'sell-new': openSell(el.dataset.pid); break;
    case 'sell-save': {
      const name=val('zClient'), pk=byId(S.packages,val('zPkg')), price=numv('zPrice'), date=val('zDate')||today();
      if(!name){ toast('أدخلي اسم الزبونة'); break }
      if(!pk){ toast('اختاري الباقة'); break }
      const months=+pk.validMonths||0; let expiry='';
      if(months){ const d=new Date(date+'T00:00'); d.setMonth(d.getMonth()+months); expiry=d.toLocaleDateString('sv-SE') }
      const sub={id:uid('k'),client:name,phone:val('zPhone'),packageId:pk.id,packageName:pk.name,
        sessions:Math.max(1,pk.sessions||1),used:0,price:price,date:date,expiry:expiry,
        lines:JSON.parse(JSON.stringify(pk.lines)),by:ME.name};
      S.subs.push(sub);
      const v={id:uid('v'),no:nextInvNo(),bookingId:'',client:name,phone:sub.phone,date:date,staffId:ME.id,
        lines:[{name:'باقة: '+pk.name+' ('+sub.sessions+' جلسة)',price:price,qty:1}],transport:0,discount:0,total:price,
        payments:(val('zPaid')==='1'?[{amount:price,method:val('zMethod'),date:date,by:ME.name}]:[]),
        createdAt:new Date().toISOString()};
      S.invoices.push(v);
      const c=upsertClient({client:name,phone:sub.phone,area:''});
      await put('subs',sub); await put('invoices',v); if(c) await put('clients',c);
      close(); render(); toast('تم بيع الباقة — صدرت الفاتورة '+v.no); openInvoice(v.id); break; }
    case 'sub-del': {
      if(!confirm('حذف الباقة المباعة من السجل؟')) break;
      S.subs=S.subs.filter(x=>x.id!==id); await rm(id); render(); break; }
    case 'pkg-use': {
      harvestB(); const s=byId(S.subs,el.dataset.sub); if(!s) break;
      D.b.subId=s.id;
      (s.lines||[]).forEach(l=>D.b.lines.push({sid:l.sid,name:l.name+' (من الباقة)',price:0,qty:l.qty||1,pkg:true}));
      renderBooking(); break; }
    case 'pkg-clear': {
      harvestB(); D.b.subId=''; D.b.lines=D.b.lines.filter(l=>!l.pkg); renderBooking(); break; }
    case 'consume-skip': await finishBooking(D.finishId); break;
    case 'consume-save': {
      const low=[];
      for(const it of S.items){
        const inp=document.getElementById('c_'+it.id);
        const q=inp?Math.max(0,parseFloat(inp.value)||0):0;
        if(q>0){
          it.qty=Math.max(0,it.qty-q);
          const mv={id:uid('m'),itemId:it.id,type:'out',qty:q,by:ME.name,at:today()+'T00:00',
            bookingId:D.finishId,note:'استهلاك موعد'};
          S.movements.push(mv);
          await put('items',it); await put('movements',mv);
          if(it.qty<=it.min) low.push(it.name);
        }
      }
      await finishBooking(D.finishId);
      if(low.length) setTimeout(()=>toast('تنبيه: '+low.join('، ')+' وصلت إلى الحد الأدنى'),1500);
      break; }

    case 'imp-open': openImport(); break;
    case 'imp-run': {
      const sup=val('impSup');
      const wantExp=val('impExp')==='1', expDate=val('impDate')||today();
      const raw=(document.getElementById('impText')||{}).value||'';
      let added=0, skipped=0, bad=0, wiped=0;
      const wipeFirst=(document.getElementById('impWipe')||{}).checked;
      if(wipeFirst){
        if(!confirm('سيتم حذف كل أصناف المخزون الحالية نهائياً قبل الاستيراد. متابعة؟')) break;
        for(const x of S.items.slice()){ await rm(x.id); wiped++ }
        S.items=[];
      }
      for(const lineRaw of raw.split('\n')){
        const line=lineRaw.trim(); if(!line) continue;
        const p=line.split('|').map(x=>x.trim());
        if(p.length<5||!p[0]){ bad++; continue }
        if(S.items.some(i=>i.name===p[0])){ skipped++; continue }
        const isGift=(p[6]||'').indexOf('هدية')===0;
        const it={id:uid('i'),name:p[0],cat:p[1]||'عام',unit:p[2]||'حبة',
          qty:parseFloat(p[3])||0,min:(parseFloat(p[3])||0)>=5?1:0,cost:parseFloat(p[4])||0,cost0:parseFloat(p[4])||0,
          usesPerPack:parseInt(p[5],10)||15,gift:isGift,costAt:today(),supplier:sup,url:'',loc:''};
        S.items.push(it); await put('items',it); added++;
      }
      close(); render();
      if(wantExp){
        const total=S.items.filter(i=>i.supplier===sup&&!i.gift).reduce((a,i)=>a+i.qty*i.cost,0);
        if(total>0){
          const ex={id:uid('e'),date:expDate,cat:'بضاعة ومستلزمات',amount:Math.round(total*100)/100,
            note:'مشتريات مستوردة — '+sup,by:ME.name,payer:ME.id};
          S.expenses.push(ex); await put('expenses',ex);
        }
      }
      try{ if(typeof save==='function') save() }catch(e){}
      toast((wiped?`حُذف ${wiped} صنفاً قديماً · `:'') + `تم استيراد ${added} صنفاً` + (skipped?` · تُخطّي ${skipped} موجودة`:'') + (bad?` · ${bad} سطر غير صالح`:''));
      break; }

    case 'clean-open': openCleanup(); break;
    case 'clean-run': {
      const on=id2=>{const e=document.getElementById(id2); return !!(e&&e.checked)};
      if(!confirm('سيتم الحذف نهائياً ولا يمكن التراجع. متابعة؟')) break;
      const g=seedSets(); let count=0;
      const wipe=async(arr,bucketName,list)=>{
        for(const x of list){ await rm(x.id); count++ }
        const ids=new Set(list.map(x=>x.id));
        S[bucketName]=S[bucketName].filter(x=>!ids.has(x.id));
      };
      if(on('clSvc')) await wipe(0,'services',g.svc);
      if(on('clItm')) await wipe(0,'items',g.itm);
      if(on('clCl'))  await wipe(0,'clients',g.cl);
      if(on('clAll')){
        for(const b of ['bookings','invoices','movements','expenses','subs']){
          for(const x of S[b]){ await rm(x.id); count++ }
          S[b]=[];
        }
      } else if(on('clBk')){
        const ids=new Set(g.bk.map(x=>x.id));
        for(const v of S.invoices.filter(v=>ids.has(v.bookingId))){ await rm(v.id); count++ }
        S.invoices=S.invoices.filter(v=>!ids.has(v.bookingId));
        for(const m of S.movements.filter(m=>ids.has(m.bookingId))){ await rm(m.id); count++ }
        S.movements=S.movements.filter(m=>!ids.has(m.bookingId));
        await wipe(0,'bookings',g.bk);
      }
      try{ if(typeof save==='function') save() }catch(e){}
      close(); render(); toast(`تم حذف ${count} سجلاً تجريبياً`); break; }

    /* inventory */
    case 'item-new': openItem(null); break;
    case 'item-edit': openItem(id); break;
    case 'item-save': {
      const name=val('iName'); if(!name){ toast('أدخلي اسم الصنف'); break }
      const o={name,cat:val('iCat')||'عام',unit:val('iUnit')||'حبة',qty:numv('iQty'),min:numv('iMin'),
        cost:numv('iCost'),cost0:numv('iCost0')||numv('iCost'),usesPerPack:numv('iUses')||15,
        gift:!!(document.getElementById('iGift')||{}).checked,
        supplier:val('iSup'),url:val('iUrl'),loc:val('iLoc')};
      let rec;
      if(id){ rec=byId(S.items,id);
        if(numv('iCost')!==rec.cost) o.costAt=today();
        Object.assign(rec,o) }
      else { rec=Object.assign({id:uid('i'),costAt:today()},o); S.items.push(rec) }
      await put('items',rec); close(); render(); toast('تم حفظ الصنف'); break; }
    case 'item-del': {
      if(!confirm('حذف الصنف من المخزون؟')) break;
      S.items=S.items.filter(x=>x.id!==id); await rm(id); close(); render(); toast('تم حذف الصنف'); break; }
    case 'mv-out': {
      if(el.dataset.bid&&document.getElementById('bClient')) await saveBooking(true);
      openMove('out',id,el.dataset.bid); break; }
    case 'mv-in': openMove('in',id); break;
    case 'mv-save': {
      const type=el.dataset.type, it=byId(S.items,val('mItem')), q=Math.max(1,numv('mQty'));
      if(!it){ toast('اختاري الصنف'); break }
      if(type==='out'&&q>it.qty){ toast('الكمية المطلوبة أكبر من المتوفّر ('+it.qty+')'); break }
      it.qty=type==='out'?it.qty-q:it.qty+q;
      const mv={id:uid('m'),itemId:it.id,type:type,qty:q,by:ME.name,at:(val('mDate')||today())+'T00:00',
        bookingId:type==='out'?val('mBk'):'',note:val('mNote')};
      S.movements.push(mv);
      await put('items',it); await put('movements',mv);
      if(type==='in'){
        const unit=numv('mUnit'); const c=unit*q;
        const asGift=val('mExp')==='0';
        if(it.gift!==asGift){ it.gift=asGift; await put('items',it) }
        if(unit>0&&unit!==it.cost){
          if(it.cost0==null) it.cost0=it.cost;
          it.cost=unit; it.costAt=val('mDate')||today(); await put('items',it); }
        if(c>0&&val('mExp')==='1'){
          const ex={id:uid('e'),date:val('mDate')||today(),cat:'بضاعة ومستلزمات',amount:c,
            note:it.name+' ×'+q,by:ME.name,payer:ME.id};
          S.expenses.push(ex); await put('expenses',ex) } }
      close(); render();
      toast(type==='out'?`تم صرف ${q} ${it.unit} من ${it.name}`+(it.qty<=it.min?' — الصنف أصبح تحت الحد الأدنى!':''):'تم تسجيل الاستلام');
      break; }

    /* invoices & money */
    case 'inv-open': openInvoice(id); break;
    case 'pay-new': openPay(id); break;
    case 'pay-save': {
      const v=byId(S.invoices,id), amt=numv('pAmt');
      if(amt<=0){ toast('أدخلي مبلغاً صحيحاً'); break }
      v.payments=v.payments||[];
      v.payments.push({amount:amt,method:val('pMethod'),date:val('pDate')||today(),by:ME.name});
      await put('invoices',v); render(); openInvoice(v.id); toast('تم تسجيل الدفعة'); break; }
    case 'inv-del': {
      if(!confirm('حذف الفاتورة؟')) break;
      S.invoices=S.invoices.filter(x=>x.id!==id); await rm(id); close(); render(); toast('تم حذف الفاتورة'); break; }
    case 'exp-new': openExpense(null); break;
    case 'exp-edit': openExpense(id); break;
    case 'exp-save': {
      const amt=numv('eAmt'); if(amt<=0){ toast('أدخلي مبلغاً صحيحاً'); break }
      let ex;
      if(id){ ex=byId(S.expenses,id) } else { ex={id:uid('e'),by:ME.name}; S.expenses.push(ex) }
      Object.assign(ex,{date:val('eDate')||today(),cat:val('eCat'),amount:amt,note:val('eNote'),
        payer:val('ePayer'),itemId:val('eItem'),qty:numv('eQty')||1});
      const li=byId(S.items,val('eItem'));
      const eq=numv('eQty');
      if(li&&eq>0){
        const unit=amt/eq;
        if(unit>0&&Math.abs(unit-li.cost)>0.009){
          if(li.cost0==null) li.cost0=li.cost;
          li.cost=Math.round(unit*100)/100; li.costAt=val('eDate')||today();
        }
        const addStock=!id && !!(document.getElementById('eStock')||{}).checked;
        if(addStock){
          li.qty=(+li.qty||0)+eq;
          if(li.gift){ li.gift=false }
          const mv={id:uid('m'),itemId:li.id,type:'in',qty:eq,by:ME.name,
            at:(val('eDate')||today())+'T00:00',bookingId:'',note:'استلام من مصروف: '+(val('eNote')||'')};
          S.movements.push(mv); await put('movements',mv);
        }
        await put('items',li);
      }
      await put('expenses',ex); close(); render(); toast('تم حفظ المصروف'); break; }
    case 'exp-del': {
      if(!confirm('حذف المصروف؟')) break;
      S.expenses=S.expenses.filter(x=>x.id!==id); await rm(id); render(); break; }

    /* services */
    case 'svc-new': openService(null); break;
    case 'svc-edit': openService(id); break;
    case 'svc-save': {
      harvestS(); const sv=D.s;
      if(!sv.name){ toast('أدخلي اسم الخدمة'); break }
      const o={name:sv.name,cat:sv.cat||'عام',price:sv.price,dur:sv.dur||30,recipe:sv.recipe||[]};
      let rec;
      if(id){ rec=byId(S.services,id); Object.assign(rec,o) } else { rec=Object.assign({id:uid('s')},o); S.services.push(rec) }
      await put('services',rec); close(); render(); toast('تم حفظ الخدمة'); break; }
    case 'svc-del': {
      if(!confirm('حذف الخدمة من قائمة الأسعار؟ لن تتأثر الحجوزات السابقة.')) break;
      S.services=S.services.filter(x=>x.id!==id); await rm(id); render(); break; }

    /* users */
    case 'usr-new': openUser(null); break;
    case 'usr-edit': openUser(id); break;
    case 'usr-save': {
      const name=val('uName'), role=val('uRole'), title=val('uTitle'), color=val('uColor');
      if(!name){ toast('أدخلي الاسم'); break }
      if(id){
        const u=byId(S.users,id); Object.assign(u,{name,title,role,color});
        if(id===ME.id) ME=u;
        await putProfile({id:u.id,name:u.name,username:u.username,title:u.title,role:u.role,color:u.color});
      }else{
        const un=val('uUser').toLowerCase(), pw=val('uPass');
        if(!un||pw.length<6){ toast('أدخلي اسم مستخدم وكلمة مرور لا تقل عن 6 خانات'); break }
        if(S.users.some(u=>(u.username||'').toLowerCase()===un)){ toast('اسم المستخدم مستخدم مسبقاً'); break }
        const btn=el; btn.textContent='جارٍ الإنشاء…'; btn.disabled=true;
        const created=await signUpUser(un,pw,{name:name,role:role,title:title,color:color});
        await new Promise(r=>setTimeout(r,600));
        await putProfile({id:created.id,name:name,username:un,title:title,role:role,color:color});
      }
      await pull(); ME=S.users.find(u=>u.id===ME.id)||ME;
      close(); render(); toast('تم حفظ البيانات'); break; }
    case 'usr-del': {
      if(id===ME.id){ toast('لا يمكن حذف حسابك الخاص'); break }
      if(!confirm('إيقاف دخول هذه المستخدمة؟ حجوزاتها بتبقى مسجلة باسمها.')) break;
      try{ await api('/rest/v1/profiles?id=eq.'+encodeURIComponent(id),{method:'DELETE'}) }catch(err){ toast(err.message) }
      await pull(); render(); toast('تم إيقاف الحساب'); break; }
  }
  }catch(err){ console.error(err); toast(err.message||'حدث خطأ') }
});
})();
</script>
</body>
</html>
